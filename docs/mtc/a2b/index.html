cuentra con las siguientes marcas en el pavimento (malla ortogonal de color amarillo), significa:", "o": ["Que no puede detener el vehículo dentro del área de intersección.", "Que se están realizando trabajos de emergencia en el área demarcada.", "Que únicamente puede detener el vehículo dentro del área de intersección.", "Que es una isla de refugio peatonal."], "a": 0, "base": ""}, {"id": "1-200", "part": 1, "n": 200, "q": "De acuerdo al siguiente gráfico, es correcto afirmar que:", "o": ["La zona que permite adelantar inicia con las líneas amarillas continuas.", "Los conductores pueden estacionarse al empezar las líneas continuas.", "La zona de no adelantar inicia con las líneas amarillas continuas.", "El conductor del camión puede estacionarse antes de empezar las líneas continuas"], "a": 2, "base": ""}, {"id": "2-1", "part": 2, "n": 1, "q": "¿Cuál es un elemento, característica o dispositivo considerados como requisito técnico general?", "o": ["Dispositivos de alumbrado y señalización óptica.", "Sistema de frenos", "Carrocería diseñada para evitar salpicaduras de las ruedas y/o protegida por guardafangos o escarpines", "Todas las anteriores"], "a": 3, "base": "Artículo 12 del RNV"}, {"id": "2-2", "part": 2, "n": 2, "q": "¿La instalación de las láminas retroreflectivas deben ser de acuerdo a las siguientes especificaciones?", "o": ["Las láminas deben ser fijadas horizontalmente en los laterales del vehículo y en la parte posterior, alternando los colores rojo y blanco.", "Las láminas deben colocarse a no menos de 300 mm y no más de 1,60 m sobre la superficie de la carretera.", "Las láminas podrán fijarse a la carrocería del vehículo por medio de diferentes elementos, tales como: remaches, tornillos, autoadhesivo o pegamento, asegurando la fijación permanente.", "Todas las anteriores"], "a": 3, "base": "Numeral 10 del Anexo III del RNV"}, {"id": "2-3", "part": 2, "n": 3, "q": "¿Los vehículos de las categorías M2 destinados al servicio de transporte terrestre, M3 y N deben contar con láminas retroreflectivas?", "o": ["Solo los Vehículos M3.", "Si", "No es obligatorio.", "Ninguna de las anteriores"], "a": 1, "base": "Artículo 14 del RNV"}, {"id": "2-4", "part": 2, "n": 4, "q": "¿Qué se entiende por neumático reencauchado?", "o": ["Neumático que luego de haberse desgastado, se vuelve operativo al efectuar nuevas ranuras en su banda de rodamiento.", "Neumático que luego de haberse desgastado, se vuelve operativo al adherirle una nueva banda de rodamiento.", "Que sin haberse desgastado, presenta ranuras y se le adhiere una banda de rodamiento.", "Ninguna de las anteriores"], "a": 1, "base": "Anexo II del RNV"}, {"id": "2-5", "part": 2, "n": 5, "q": "¿A qué se denomina Sistema bi- combustible y Sistema Dual?", "o": ["sistema bi-combustible (gasolina/GNV) o sistema dual (combustible líquido/GNV)", "sistema bi-combustible (Diésel/GNV) o sistema dual (combustible líquido/GNV)", "sistema bi-combustible (gasolina/GNV) o sistema dual (GLP/GNV)", "ninguna de las anteriores"], "a": 0, "base": "Anexo II del RNV"}, {"id": "2-6", "part": 2, "n": 6, "q": "¿Cuántas ruedas de repuesto deben contar los vehículos de categoría M y N?", "o": ["2.", "1.", "no es obligatorio.", "ninguna de las anteriores"], "a": 1, "base": "Artículo 14 del RNV"}, {"id": "2-7", "part": 2, "n": 7, "q": "¿Cuál es una característica adicional para los vehículos de las categorías M, según el Reglamento Nacional de Vehículos?", "o": ["Retrovisores y Asientos del conductor.", "Guardafangos.", "Bocina de sonido uniforme y continua y Fórmula rodante.", "a y c son correctas"], "a": 3, "base": "Artículo 13 del RNV"}, {"id": "2-8", "part": 2, "n": 8, "q": "¿Cuál es el documento que acredita ante SUNARP las modificaciones efectuadas a las características registrables de los vehículos?", "o": ["Certificado de Revisión Técnica Vehicular.", "Certificado de conformidad de Conversión y modificación", "Certificado de Conformidad de Modificación", "Declaración Jurada de conformidad de Modificación"], "a": 2, "base": "Artículo 28 del RNV"}, {"id": "2-9", "part": 2, "n": 9, "q": "La definición de: Complementarias a las luces altas utilizada para alumbrar una mayor distancia de la vía por delante del vehículo, corresponde a:", "o": ["Luz neblinero delantero.", "Luz de largo alcance", "Luz baja", "Luz de freno"], "a": 1, "base": "Artículo 41 del RNV"}, {"id": "2-10", "part": 2, "n": 10, "q": "¿Cuál es una medida preventiva que puede aplicar la autoridad competente, según en el Reglamento Nacional de Vehículos?", "o": ["Retención de la licencia de conducir.", "Retención de mercancía.", "Internamiento del vehículo.", "a y c son correctas."], "a": 2, "base": "Artículo 78 del RNV"}, {"id": "2-11", "part": 2, "n": 11, "q": "¿Cuál es la definición que corresponde a la carrocería, de acuerdo al Reglamento Nacional de Vehículos?", "o": ["Estructura básica del vehículo, compuesta por el bastidor, el tren motriz, suspensión, dirección, ejes, ruedas y otras partes mecánicas relacionadas", "Estructura que se instala sobre el chasis o estructura autoportante, para el transporte de personas y/o mercancías.", "Elemento mecánico que sirve de soporte del vehículo, aloja a las ruedas y permite la movilidad del mismo.", "Estructura básica del vehículo, que sirve de soporte del vehículo y se instala con el chasis."], "a": 1, "base": "Anexo II del RNV"}, {"id": "2-12", "part": 2, "n": 12, "q": "La definición: El conjunto de elementos que hacen posible que el vehículo pueda operarse usando combustible líquido y GNV simultáneamente) corresponde a:", "o": ["Sistema bi-combustible", "Sistema Dual", "Sistema Simultaneo", "ninguna de las anteriores"], "a": 1, "base": "Numeral 64 del Anexo II del RNV"}, {"id": "2-13", "part": 2, "n": 13, "q": "¿Qué porcentaje como mínimo de transparencia debe tener los parabrisas de vidrio de seguridad?", "o": ["50%", "70%", "80%", "60%"], "a": 1, "base": "Artículo 14 del RNV"}, {"id": "2-14", "part": 2, "n": 14, "q": "¿Qué porcentaje como máximo de oscurecimiento debe tener los parabrisas de vidrio de seguridad?", "o": ["40%", "20%.", "30%.", "50%"], "a": 2, "base": "Artículo 14 del RNV"}, {"id": "2-15", "part": 2, "n": 15, "q": "¿De qué categoría son los Vehículos de mas de ocho asientos, sin contar el asiento del conductor y peso bruto vehicular de 5 toneladas o menos?", "o": ["M2", "M3", "N3", "M1"], "a": 0, "base": "Anexo I del RNV"}, {"id": "2-16", "part": 2, "n": 16, "q": "¿A cuál clase pertenecen los vehículos construidos exclusivamente para el transporte de pasajeros sentados?", "o": ["Clase I", "Clase II", "Clase III", "Ninguna de las anteriores"], "a": 2, "base": "Anexo I del RNV"}, {"id": "2-17", "part": 2, "n": 17, "q": "¿A qué categoría pertenecen los vehículos de mas de ocho asientos, sin contar el asiento del conductor y peso bruto vehicular de más de 5 toneladas?", "o": ["M1", "M3", "M2", "N3"], "a": 1, "base": "Anexo I del RNV"}, {"id": "2-18", "part": 2, "n": 18, "q": "¿A qué se denomina un ómnibus bi- articulado?", "o": ["Vehículo compuesto de tres secciones rígidas unidas entre sí por dos juntas articuladas permitiendo libre paso entre las secciones.", "Vehículo compuesto de dos secciones rígidas unidas entre sí por una junta articulada permitiendo libre paso entre una sección y otra.", "Vehículo con la carrocería monocasco autoportante a la cual se fija el conjunto direccional en la parte delantera y el conjunto del tren motriz en la parte posterior", "Ninguna de la anteriores"], "a": 0, "base": "Anexo I del RNV"}, {"id": "2-19", "part": 2, "n": 19, "q": "¿Es obligatorio el Sistema de Freno Auxiliar para los vehículos de categoría M2 y M3?", "o": ["Si", "No, es opcional para ambos", "Para los vehículos de categoría M2 es opcional y para los de categoría M3 es obligatorio", "No se aplica para esas categorías"], "a": 2, "base": "Numeral 2 del Anexo III del RNV"}, {"id": "2-20", "part": 2, "n": 20, "q": "¿Qué cantidad mínima de puertas de servicio deben tener los vehículos que se destinen al servicio de transporte escolar?", "o": ["1", "2", "Depende de la categoría M2 y M3", "3"], "a": 0, "base": "Numeral 13 del Anexo III del RNV"}, {"id": "2-21", "part": 2, "n": 21, "q": "¿Qué cantidad mínima de salidas de emergencia deben tener los vehículos de categoría M2 y M3 que se destinen al servicio de transporte escolar?", "o": ["2 salidas de emergencia para ambas categorías", "2 salidas de emergencia para la categoría M2 y 3 salidas de emergencia para la categoría M3", "1 Salida de emergencia para la categoría M2 y 2 salidas de emergencia para la categoría M3", "1 Salida de emergencia como mínimo para ambas categorías"], "a": 1, "base": "Numeral 13 del Anexo III del RNV"}, {"id": "2-22", "part": 2, "n": 22, "q": "¿Cuál es la exigencia de la tercera luz de freno?", "o": ["opcional", "obligatoria", "No aplica a categorías M", "Ninguna de las anteriores"], "a": 0, "base": "Anexo III del RNV"}, {"id": "2-23", "part": 2, "n": 23, "q": "¿Cuál es la potencia mínima de la luz baja?", "o": ["20W", "10W", "25w", "55w"], "a": 2, "base": "Anexo III del RNV"}, {"id": "2-24", "part": 2, "n": 24, "q": "La licencia de conducir de Clase A- Categoría II B tendrá una vigencia de…..", "o": ["3 años", "5 años", "8 años", "2 años"], "a": 0, "base": "Artículo 18 del Reglamento de Licencias"}, {"id": "2-25", "part": 2, "n": 25, "q": "Para obtener una licencia de conducir clase A categoría II B se requiere tener grado de instrucción mínimo de:", "o": ["Secundaria completa", "Primaria completa", "Secundaria incompleta", "Superior técnica"], "a": 0, "base": "Artículo 14 del Reglamento de Licencias"}, {"id": "2-26", "part": 2, "n": 26, "q": "Para conducir vehículos de transporte terrestre de materiales peligrosos, ____ necesario contar con la licencia que corresponda a la categoría del vehículo que transporta los materiales peligrosos.", "o": ["No es.", "Es", "Depende de la mercancía que transporta", "Ninguna de las anteriores"], "a": 1, "base": "Artículo 11 del Reglamento de Licencias"}, {"id": "2-27", "part": 2, "n": 27, "q": "Las sanciones por las infracciones al servicio de transporte se encuentran comprendidas en:", "o": ["El Reglamento Nacional de Administración de Transporte.", "El Texto Único Ordenado del Reglamento Nacional de Tránsito - Código de Tránsito.", "El Reglamento Nacional de Inspecciones Técnicas Vehiculares.", "Todas las anteriores."], "a": 0, "base": "Artículo 100 y Anexo 1 y 2 del RENAT"}, {"id": "2-28", "part": 2, "n": 28, "q": "Con relación a las obligaciones del conductor del servicio de transporte terrestre. Marque la alternativa incorrecta:", "o": ["Debe ser titular de una licencia de conducir de la clase y categoría que corresponda al vehículo que conduce.", "Debe portar su licencia de conducir vigente, así como la documentación del vehículo.", "Debe conducir solo vehículos habilitados por la autoridad competente.", "Puede oponerse a la labor de supervisión y fiscalización de la autoridad competente."], "a": 3, "base": "Artículo 31 del RENAT"}, {"id": "2-29", "part": 2, "n": 29, "q": "La edad máxima para conducir vehículos destinados al servicio de transporte terrestre es de:", "o": ["55 años.", "60 años.", "65 años.", "70 años."], "a": 3, "base": "Numeral 29.2 del artículo 29 del RENAT"}, {"id": "2-30", "part": 2, "n": 30, "q": "El servicio de transporte especial de personas es aquel que se presta:", "o": ["Sin regularidad ni uniformidad.", "Con regularidad y uniformidad.", "Sin regularidad y con uniformidad.", "Con regularidad y sin uniformidad"], "a": 0, "base": "Artículo 3.63 del artículo 3 del RENAT"}, {"id": "2-31", "part": 2, "n": 31, "q": "¿Cuál de los siguientes servicios no corresponde al servicio de transporte especial de personas?", "o": ["Diferenciado.", "Turístico.", "De trabajadores.", "De estudiantes."], "a": 0, "base": "Numeral 3.63 del artículo 3 del RENAT"}, {"id": "2-32", "part": 2, "n": 32, "q": "Si un conductor atenta contra la integridad física del inspector durante la realización de sus funciones, será sancionado con:", "o": ["Cancelación de licencia de conducir e inhabilitación para obtener nueva licencia por tres (3) años.", "Suspensión de la licencia de conducir por tres (3) años.", "Cancelación de la licencia de conducir e inhabilitación definitiva para obtener nueva licencia. Multa de 0.5 UIT.", "Cancelación de la licencia de conducir por un (1) año e inhabilitación definitiva para obtener nueva licencia. Multa de 1 UIT."], "a": 2, "base": "Código F.7 del Anexo 2 del RENAT"}, {"id": "2-33", "part": 2, "n": 33, "q": "En el servicio de transporte la vigencia de la habilitación del conductor es ….y de renovación automática una vez acreditada la vigencia de la licencia de conducir de la categoría correspondiente al vehículo habilitado", "o": ["Anual.", "Cada dos años.", "Cada cinco años.", "Ninguna de las anteriores."], "a": 0, "base": "Numeral 71.4 del artículo 71 del RENAT."}, {"id": "2-34", "part": 2, "n": 34, "q": "¿A partir de qué edad el conductor del servicio de transporte deberá rendir y aprobar los exámenes médicos semestrales que establezca la Dirección General de Transporte Terrestre (DGTT)?", "o": ["60 años.", "55 años.", "65 años.", "No existe dicho exigencia en la norma."], "a": 2, "base": "Numeral 29.2 del artículo 29 del RENAT"}, {"id": "2-35", "part": 2, "n": 35, "q": "Si un presunto infractor paga voluntariamente dentro de los cinco días hábiles de levantada el acta de control, la multa que corresponda a la infracción imputada, ésta será reducida en:", "o": ["20% de su monto.", "30% de su monto.", "40% de su monto.", "50% de su monto."], "a": 3, "base": "Artículo 105.1 del artículo 105 del RENAT"}, {"id": "2-36", "part": 2, "n": 36, "q": "Cuando hablamos del «servicio de transporte especial de ámbito provincial, prestado en vehículos M1 de la clasificación vehicular, que tiene por objeto el traslado de personas desde un punto de origen hasta un punto de destino señalado por quien lo contrata.», nos estamos refiriendo al:", "o": ["Servicio de transporte de trabajadores.", "Servicio de transporte de mercancías.", "Servicio de transporte de taxi.", "Servicio de transporte turístico."], "a": 2, "base": "Numeral 3.63.6 del artículo 3 del RENAT"}, {"id": "2-37", "part": 2, "n": 37, "q": "Es la medida preventiva que consiste en el traslado del vehículo fuera de la vía pública dispuesto por la autoridad competente y/o PNP, utilizando cualquier medio eficaz y proporcional al fin que se persigue:", "o": ["Remoción del vehículo.", "Retención del vehículo.", "Internamiento del vehículo.", "Interrupción del viaje."], "a": 0, "base": "Artículo 110 del RENAT"}, {"id": "2-38", "part": 2, "n": 38, "q": "Con relación a las obligaciones del conductor del servicio de transporte terrestre, es obligatorio que el conductor ….", "o": ["No deba tener su licencia de conducir suspendida, retenida o cancelada", "No deba llegar o exceder de tope máximo de 100 puntos firmes", "No tenga impuesta dos o más infracciones Muy Graves, cinco o más infracciones Graves o una infracción Muy Grave y tres o más infracciones Graves", "Todas las anteriores."], "a": 3, "base": "Artículo 31 del RENAT"}, {"id": "2-39", "part": 2, "n": 39, "q": "El servicio de transporte debe ser prestado a través de vehículos que:", "o": ["Se encuentren habilitados.", "Hayan aprobado la Inspección Técnica Vehicular, cuando corresponda.", "Cuenten con póliza de Seguro Obligatorio de Accidentes de Tránsito vigente o Certificado Contra Accidentes de Tránsito, según corresponda.", "Todas las anteriores."], "a": 3, "base": "Numeral 41.1.3 del artículo 41 del RENAT"}, {"id": "2-40", "part": 2, "n": 40, "q": "¿Qué sanción le corresponde al conductor que presta el servicio sin contar con autorización otorgada por la autoridad competente o en una modalidad o ámbito diferente al autorizado?", "o": ["Multa de 1 UIT", "Multa de 2 UIT", "Multa de 0.5 UIT", "Multa de 0.05 UIT"], "a": 0, "base": "Código F1 del Anexo 2 del RENAT"}, {"id": "2-41", "part": 2, "n": 41, "q": "Con relación a las jornadas de conducción. Marque la alternativa correcta:", "o": ["No debe exceder las cinco (5) horas de conducción continuas en el servicio diurno, ni las cuatro (4) horas en el servicio nocturno.", "No debe exceder las cuatro (4) horas de conducción continuas en el servicio diurno, ni las cuatro (5) horas en el servicio nocturno.", "No debe exceder las cinco (5) horas de conducción continuas en el servicio diurno, ni las cuatro (4.5) horas en el servicio nocturno.", "No debe exceder las cuatro (4) horas de conducción continuas en el servicio diurno, ni las tres (3) horas en el servicio nocturno."], "a": 0, "base": "Numeral 30.2 del artículo 30 del RENAT"}, {"id": "2-42", "part": 2, "n": 42, "q": "Para efectos de la jornada de conducción, ¿qué horario es considerado como nocturno?", "o": ["El comprendido entre las 9:00 p.m. y 6:00 a.m.", "El comprendido entre las 10:00 p.m. y las 5:59 a.m.", "El comprendido entre las 11:00 p.m. y las 5:59 a.m.", "El comprendido entre las 11:00 p.m. y las 6:00 a.m."], "a": 1, "base": "Numeral 30.3 del artículo 30 del RENAT"}, {"id": "2-43", "part": 2, "n": 43, "q": "Para efectos de la jornada de conducción, ¿qué horario es considerado como diurno?", "o": ["El comprendido entre las 6:00 a.m. y 9:59 p.m.", "El comprendido entre las 6:00 a.m. y 10:00 p.m.", "El comprendido entre las 5:59 a.m. y 10:00 p.m.", "El comprendido entre las 5:00 a.m. y 9:00 p.m."], "a": 0, "base": "Numeral 30.3 del artículo 30 del RENAT"}, {"id": "2-44", "part": 2, "n": 44, "q": "Es el documento que sustenta el traslado de bienes por el transportista autorizado para prestar el servicio de transporte terrestre de mercancías:", "o": ["Hoja de ruta", "Flete", "Licencia de conducir", "Guía de Remisión de Transportista"], "a": 3, "base": ""}, {"id": "2-45", "part": 2, "n": 45, "q": "Si el conductor transporta a sabiendas, productos explosivos, inflamables corrosivos, venenosos o similares en un vehículo del servicio de transporte de personas, comete una infracción calificada como:", "o": ["Muy grave", "Grave", "Leve", "No es ni la alternativa a) ni la alternativa c)"], "a": 0, "base": "Infracción S7 del anexo 2 del RENAT"}, {"id": "2-46", "part": 2, "n": 46, "q": "Es la persona natural o jurídica por cuyo encargo se transporte mercancías en un vehículo habilitado para la prestación del servicio de transporte público de mercancías:", "o": ["Transportista", "Destinatario de carga", "Generador de carga", "Ninguna de las anteriores"], "a": 2, "base": "Numeral 3.35 del artículo 3 del RENAT"}, {"id": "2-47", "part": 2, "n": 47, "q": "El inspector de transporte es la persona acreditada u homologada para:", "o": ["Realizar acciones de control, supervisión y detección de incumplimientos o infracciones a las normas del servicio de transporte terrestre.", "Imponer las papeletas de infracción al tránsito", "Emitir la resolución de sanción por las infracciones a las normas del servicio de transporte terrestre", "Todas las anteriores."], "a": 3, "base": "Numeral 3.40 del art.3 del RENAT"}, {"id": "2-48", "part": 2, "n": 48, "q": "Los terminales terrestres son obligatorios para el servicio público de transporte regular de personas en el ámbito:", "o": ["Nacional y Regional.", "Regional y Provincial.", "Nacional, Regional y Provincial.", "Distrital, Provincial, Regional, Nacional e Internacional."], "a": 2, "base": "Artículo 34 del RENAT"}, {"id": "2-49", "part": 2, "n": 49, "q": "¿Cuál es el documento levantado por el inspector de transporte, en la que se hace constar los resultados de acción de control?", "o": ["Acta de Control.", "Papeleta de infracción levantada por la PNP.", "Acto administrativo emitido por el funcionario que lleva a cabo el procedimiento administrativo de sanción.", "Todas las Anteriores."], "a": 0, "base": "Artículo 94.1 del artículo 94 del RENAT"}, {"id": "2-50", "part": 2, "n": 50, "q": "El Reglamento Nacional de Administración de Transporte no comprende el servicio de :", "o": ["Trabajadores", "Servicio de Transporte en vehículos menores.", "Servicio de Transporte en auto colectivo.", "Servicio de Transporte Turístico."], "a": 1, "base": "Numeral 3.63 del artículo 3 del RENAT"}, {"id": "2-51", "part": 2, "n": 51, "q": "La auditoría anual es una modalidad de fiscalización del servicio de transporte, que es realizada aleatoriamente a los transportistas, a la infraestructura complementaria de transporte y a…….....", "o": ["Los conductores habilitados", "Los establecimientos de salud que realizan los exámenes médicos a los conductores", "La red vial nacional", "Todas las anteriores"], "a": 0, "base": "Artículo 91 del RENAT"}, {"id": "2-52", "part": 2, "n": 52, "q": "¿Qué sanción pecuniaria acarrea no informar por escrito a la autoridad competente dentro de las cuarenta y ocho (48) horas de producidos los accidentes de tránsito con daños personales ocurridos durante la operación del servicio?", "o": ["Multa de 1 UIT.", "Multa de 2 UIT.", "Multa de 0.5 UIT", "No está tipificada esta conducta como infracción."], "a": 2, "base": "Código I.8 del Anexo 2 del RENAT."}, {"id": "2-53", "part": 2, "n": 53, "q": "De las siguientes alternativas, ¿cuál de ellas no es una forma a través de la cual concluye el procedimiento sancionador?", "o": ["Resolución de sanción.", "Resolución de archivamiento.", "Pago voluntario de la total de sanción.", "Ninguna de las anteriores."], "a": 3, "base": "Artículo 124 del RENAT."}, {"id": "2-54", "part": 2, "n": 54, "q": "¿Cuál de las siguientes alternativas no es una medida preventiva?", "o": ["Suspensión de la licencia de conducir.", "Interrupción del viaje.", "Remoción del vehículo.", "Suspensión precautoria del servicio."], "a": 0, "base": "Artículo 107 del RENAT."}, {"id": "2-55", "part": 2, "n": 55, "q": "Los medios probatorios que sustentan los incumplimientos y las infracciones son:", "o": ["El acta de control levantada por el inspector de transporte.", "El documento por el que se da cuenta de la detección de algún incumplimiento o infracción en la fiscalización de gabinete.", "Las actas de inspecciones, constataciones, ocurrencias, formularios y similares levantados por otras instituciones en el ejercicio de sus funciones.", "Todas las anteriores."], "a": 3, "base": "Artículo 94 del RENAT."}, {"id": "2-56", "part": 2, "n": 56, "q": "La sanción que le corresponde al conductor por obstruir la labor de fiscalización, cuando incurre en actos de simulación, suplantación u otras conductas destinadas a hacer incurrir en error a la autoridad competente respecto de la autorización para prestar el servicio, es:", "o": ["Suspensión por 30 días de la autorización.", "Suspensión por 60 días de la autorización.", "Suspensión de la licencia de conducir por 90 días y multa de 0.5 UIT.", "Suspensión por 120 días de la autorización."], "a": 2, "base": "Código F.4 del Anexo 2 del RENAT."}, {"id": "2-57", "part": 2, "n": 57, "q": "En el servicio de transporte el……….debe velar por el cumplimiento de las obligaciones que corresponden al conductor", "o": ["Generador de carga", "Usurario del servicio", "Transportista", "La a) y b) son correctas"], "a": 2, "base": "Artículo 32 del RENAT."}, {"id": "2-58", "part": 2, "n": 58, "q": "La duración acumulada de jornadas de conducción no deberá exceder:", "o": ["De doce (12) horas en un periodo de veinticuatro (24) horas, contadas desde el inicio de la conducción en un servicio.", "De ocho (8) horas en un periodo de veinticuatro (24) horas, contadas desde el inicio de la conducción en un servicio.", "De diez (10) horas en un periodo de treinta y seis (36) horas, contadas desde el inicio de la conducción en un servicio.", "De diez (10) horas en un periodo de veinticuatro (24) horas, contadas desde el inicio de la conducción en un servicio."], "a": 3, "base": "Numeral 30.2 del artículo 30 del RENAT"}, {"id": "2-59", "part": 2, "n": 59, "q": "¿A partir de qué edad los menores de edad deben ocupar su propio asiento?", "o": ["A partir de los cinco (5) años de edad.", "A partir de los tres (3) años de edad.", "A partir de los siete (7) años de edad.", "No edad mínima para que los menores de edad ocupen su propio asiento."], "a": 0, "base": "Numeral 42.1.17 del artículo 42 del RENAT."}, {"id": "2-60", "part": 2, "n": 60, "q": "En materia de transporte y tránsito terrestre, la Superintendencia de Transporte Terrestre de personas, carga y Mercancias- SUTRAN, es ….", "o": ["La entidad encargada de regular la infraestructura de transporte de uso público", "La entidad que tiene como función la promoción del mercado y la protección de los derechos de los consumidores", "El órgano rector a nivel nacional en materia de transporte y tránsito terrestre.", "La autoridad encargada de fiscalizar el servicio de transporte de personas y carga de ámbito nacional"], "a": 3, "base": "Ley Nº 29380, Ley de creación de SUTRAN"}, {"id": "2-61", "part": 2, "n": 61, "q": "¿Pueden viajar dos personas en un mismo asiento?", "o": ["Nunca se da este supuesto.", "Sí, cuando una de ellas es un menor de cinco (5) años de edad.", "Sí, cuando una de ellas es un menor de tres (3) años de edad.", "Ninguna de las anteriores."], "a": 1, "base": "Numeral 77.1.10. del artículo 77 del RENAT"}, {"id": "2-62", "part": 2, "n": 62, "q": "En el servicio de transporte estándar de ámbito provincial, está permitido:", "o": ["El viaje de personas sentadas y de pie, respetando la capacidad prevista por el fabricante.", "El transporte de mercancías correctamente estibadas", "El viaje de personas sentadas y de pie, en el lugar donde fácilmente puedan ser ubicadas", "Ninguna de las anteriores."], "a": 0, "base": "Numeral 3.62.1 del artículo 62 del RENAT"}, {"id": "2-63", "part": 2, "n": 63, "q": "De las entidades que se indican a continuación, ¿cuál de ellas no es una autoridad competente en materia de transporte y tránsito terrestre?", "o": ["El Ministerio de Transportes y Comunicaciones.", "Las municipalidades provinciales y distritales.", "El Consejo Nacional de Seguridad Vial.", "La Policía Nacional del Perú."], "a": 2, "base": "Artículo 15 de la Ley General de Transporte y Tránsito Terrestre."}, {"id": "2-64", "part": 2, "n": 64, "q": "En el servicio de transporte de personas", "o": ["Los lugares autorizados o paraderos de ruta.", "En los paraderos urbanos e interurbanos.", "En cualquier punto de la vía, siempre que se tome la debida precaución.", "Todas las anteriores."], "a": 1, "base": "Numeral 76.2.2 del artículo 76 del RENAT"}, {"id": "2-65", "part": 2, "n": 65, "q": "Al conductor que durante una acción de fiscalización se niega a entregar la información o documentación sobre su habilitación como conductor del servicio de transporte, se le debe aplicar la siguiente sanción:", "o": ["Suspensión de la licencia de conducir por 30 días calendario.", "Suspensión de la licencia de conducir por 90 días calendario y multa de 0.5 UIT.", "Suspensión de la licencia de conducir por 10 días calendario.", "Ninguna de las anteriores."], "a": 1, "base": "Infracción F.6 del Anexo 2 del RENAT"}, {"id": "2-66", "part": 2, "n": 66, "q": "Es el servicio de transporte de personas y de mercancías en un vehículo autorizado para este tipo de transporte:", "o": ["Servicio de transporte estándar.", "Servicio de transporte mixto.", "Servicio de transporte diferenciado.", "Ninguna de las anteriores."], "a": 1, "base": "Numeral 3.69 del artículo 3 del RENAT"}, {"id": "2-68", "part": 2, "n": 68, "q": "Escoja el elemento que no pertenece al sistema de transmisión de un vehículo", "o": ["Plato", "embrague", "collarín", "trapecio"], "a": 3, "base": "El sistema de transmisión incluye desde la salida de la volante del motor hasta las ruedas. El trapecio es parte del sistema de suspensión"}, {"id": "2-69", "part": 2, "n": 69, "q": "Escoja el elemento que no pertenece al sistema de suspensión de un vehículo", "o": ["Balancín", "resorte", "amortiguador", "muelle"], "a": 0, "base": "El sistema de suspensión incluye los muelles que pueden ser mecánicos o de aire, así como los amortiguadores. El balancín es un elemento del motor que activa las válvulas."}, {"id": "2-70", "part": 2, "n": 70, "q": "Escoja el elemento que no pertenece al sistema de alimentación de combustible de un vehículo", "o": ["Bomba", "inyector", "flotador", "termostato"], "a": 3, "base": "El sistema de alimentación va desde el tanque de combustible hasta la entrada de los cilindros. No pertenece el termostato por ser del sistema de refrigeración"}, {"id": "2-71", "part": 2, "n": 71, "q": "Escoja que elemento no corresponde al sistema de alimentación de un vehículo", "o": ["Filtro de combustible", "cañerías", "bomba", "varilla"], "a": 3, "base": "El sistema de alimentación va desde el tanque de combustible hasta la entrada de los cilindros. No pertenece la varilla por permitir medir la cantidad de aceite del carter"}];

  const gP=pct(G.map(q=>q.id)), eP=pct(E.map(q=>q.id));
  app.innerHTML=`
  <header><div class="logo">A2b</div><div><h1>Entrenador Brevete A-IIb</h1><small>270 preguntas oficiales del balotario MTC · meta 38/40</small></div></header>
  <div class="card">
    <div class="stat">
      <div><b>${m}/270</b><span>dominadas</span></div>
      <div><b>${lastS}</b><span>último simulacro</span></div>
      <div><b>${best}</b><span>mejor simulacro</span></div>
    </div>
    <div class="bar"><i style="width:${m/2.7}%"></i></div>
    <p class="muted" style="font-size:13px;margin:8px 0 0">Generales ${gP}% · Específicas ${eP}% · ${ready()?'<span class="pill ok">LISTO PARA EL EXAMEN</span>':'Listo = 3 simulacros seguidos con 38+'}</p>
  </div>
  <div class="grid" style="margin-bottom:12px">
    <button class="btn pri mode" onclick="smartLearn()"><b>▶ Continuar</b><span>Sigue con el siguiente bloque no dominado</span></button>
    <button class="btn mode" onclick="startSim()"><b>📝 Simulacro 40</b><span>20 generales + 20 específicas, aprueba con 35</span></button>
    <button class="btn mode" onclick="startErrors()" ${wrongIds.length?'':'disabled style="opacity:.5"'}><b>🔁 Mis errores</b><span>${wrongIds.length} pendientes</span></button>
    <button class="btn mode" onclick="startLearn('Señales y gráficos',SIGN_IDS)"><b>🚦 Señales</b><span>${SIGN_IDS.length} preguntas con imagen</span></button>
    <button class="btn mode" onclick="listView()"><b>📖 Lectura rápida</b><span>Pregunta + respuesta correcta, con buscador</span></button>
    <button class="btn mode" onclick="tipsView()"><b>💡 Plan y trucos</b><span>Cómo estudiar en 1–3 días</span></button>
  </div>
  <div class="card"><h2>Bloques (dominar = 2 aciertos seguidos)</h2>
    <div class="blocks">${BL.map(b=>{const p=pct(b.ids);return `<button class="btn blk" onclick="startBlock('${b.key}')">${b.name}<div class="bar"><i style="width:${p}%"></i></div><span class="muted" style="font-size:12px">${p}%</span></button>`}).join('')}</div>
  </div>
  <div class="card row" style="justify-content:space-between;align-items:center">
    <label class="toggle"><input type="checkbox" ${S.shuffle?'checked':''} onchange="S.shuffle=this.checked;save()"> Mezclar orden de alternativas (aprende el contenido, no la letra)</label>
    <button class="btn sm" onclick="resetAll()">Reiniciar progreso</button>
  </div>
  <p class="muted" style="font-size:12px;text-align:center">Fuente: Balotario oficial Clase A Cat. II-B (MTC). El progreso se guarda en este navegador.</p>`;
}
function startErrors(){startLearn('Mis errores',QS.filter(q=>S.wrong[q.id]&&!mastered(q)).map(q=>q.id))}
function resetAll(){
  app.insertAdjacentHTML('beforeend',`<div class="card" id="cf"><b>¿Borrar todo tu progreso?</b><div class="row" style="margin-top:10px"><button class="btn sm" onclick="S={box:{},seen:{},wrong:{},sims:[],shuffle:true,day:{}};save();home()">Sí, borrar</button><button class="btn sm" onclick="document.getElementById('cf').remove()">Cancelar</button></div></div>`);
  document.getElementById('cf').scrollIntoView({behavior:'smooth'});
}
function smartLearn(){
  const b=BL.find(b=>pct(b.ids)<100);
  if(b) return startBlock(b.key);
  startSim();
}
function startBlock(k){const b=BL.find(x=>x.key===k);startLearn(b.name,b.ids)}

/* ---------- LEARN (Leitner + re-cola) ---------- */
let LS=null;
function startLearn(name,ids){
  let pool=ids.filter(id=>!mastered(BYID[id]));
  if(!pool.length) pool=ids.slice(); // repaso si ya está todo dominado
  // primero los nunca vistos y los fallados, mezclados
  LS={name,queue:shuffle(pool),total:pool.length,done:0,streak:{},cur:null,answered:false,ok:0,bad:0};
  pool.forEach(id=>LS.streak[id]=0);
  nextLearn();
}
function nextLearn(){
  if(!LS.queue.length) return learnEnd();
  const id=LS.queue.shift(); LS.cur=id; LS.answered=false;
  const q=BYID[id];
  LS.order=S.shuffle?shuffle([0,1,2,3]):[0,1,2,3];
  const finished=Object.values(LS.streak).filter(v=>v>=2).length;
  renderQ(q,LS.order,`${LS.name}`,finished,LS.total,'pickLearn');
}
function renderQ(q,order,title,n,tot,handler,extra=''){
  const imgs=(IMG[q.id]||[]).map(s=>`<img src="${s}" alt="imagen de la pregunta">`).join('');
  app.innerHTML=`
  <div class="top"><button class="btn sm" onclick="home()">✕</button><div class="bar"><i style="width:${100*n/tot}%"></i></div><span class="muted" style="font-size:13px">${n}/${tot}${handler==='pickLearn'?' ✓':''}</span></div>
  <div class="card">
    <div class="meta"><span>${esc(title)}</span><span>${q.part===1?'General':'Específica'} Nº ${q.n}</span></div>
    <div class="q">${esc(q.q)}</div>
    ${imgs?`<div class="qimg">${imgs}</div>`:''}
    <div id="opts">${order.map((oi,i)=>`<button class="btn opt" data-oi="${oi}" onclick="${handler}(${oi},this)"><span class="k">${'abcd'[i]}</span><span>${esc(q.o[oi])}</span></button>`).join('')}</div>
    <div id="fb"></div>
    ${extra}
  </div>
  <p class="muted" style="font-size:12px;text-align:center">Teclado: <kbd>1</kbd>–<kbd>4</kbd> o <kbd>A</kbd>–<kbd>D</kbd> para responder · <kbd>Enter</kbd> siguiente</p>`;
}
function pickLearn(oi,el){
  if(LS.answered) return; LS.answered=true;
  const q=BYID[LS.cur], ok=oi===q.a;
  S.seen[q.id]=(S.seen[q.id]||0)+1;
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const v=+b.dataset.oi;if(v===q.a)b.classList.add('ok');else if(v===oi)b.classList.add('bad')});
  if(ok){
    LS.ok++; LS.streak[q.id]=(LS.streak[q.id]||0)+1;
    S.box[q.id]=Math.min(3,(S.box[q.id]||0)+1);
    if(LS.streak[q.id]<2){ // vuelve más adelante para confirmar
      const pos=Math.min(LS.queue.length, 6+((Math.random()*4)|0)); LS.queue.splice(pos,0,q.id);
    }
  }else{
    LS.bad++; LS.streak[q.id]=0; S.box[q.id]=0; S.wrong[q.id]=(S.wrong[q.id]||0)+1;
    const pos=Math.min(LS.queue.length,3); LS.queue.splice(pos,0,q.id); // reaparece pronto
  }
  save();
  const correct=q.o[q.a];
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'✅ ¡Correcto!':'❌ Respuesta correcta: <b>'+esc(correct)+'</b><br><span class="muted">Volverá en unas preguntas. Léela en voz alta una vez.</span>'}
   ${q.base?`<div class="muted" style="margin-top:6px">📚 ${esc(q.base)}</div>`:''}
   ${hint(q)}</div>
   <button class="btn pri" style="width:100%;margin-top:10px" onclick="nextLearn()" id="nx">Siguiente ↵</button>`;
}
function hint(q){
  const has=q.o.some(o=>/^ninguna/i.test(o));
  if(has && !/^ninguna/i.test(q.o[q.a])) return `<div class="muted" style="margin-top:6px;font-size:13px">💡 "Ninguna…" casi nunca es la correcta en este balotario (3 de 88).</div>`;
  return '';
}
function learnEnd(){
  const acc=LS.ok+LS.bad?Math.round(100*LS.ok/(LS.ok+LS.bad)):0;
  app.innerHTML=`<div class="card" style="text-align:center"><div class="big">🎯</div><h2 style="margin-top:10px">${esc(LS.name)}: dominado</h2>
  <p class="muted">${LS.total} preguntas · ${LS.ok} aciertos · ${LS.bad} fallos · precisión ${acc}%</p>
  <div class="row" style="justify-content:center"><button class="btn pri" onclick="smartLearn()">Siguiente bloque ▶</button><button class="btn" onclick="home()">Inicio</button></div></div>`;
}

/* ---------- SIMULACRO ---------- */
let SM=null;
function startSim(){
  const ids=[...shuffle(G).slice(0,20),...shuffle(E).slice(0,20)].map(q=>q.id);
  SM={ids,i:0,ans:{},orders:{},t0:Date.now()};
  ids.forEach(id=>SM.orders[id]=S.shuffle?shuffle([0,1,2,3]):[0,1,2,3]);
  renderSim();
}
function renderSim(){
  const id=SM.ids[SM.i], q=BYID[id];
  const extra=`<div class="row" style="justify-content:space-between;margin-top:10px">
    <button class="btn sm" onclick="simMove(-1)" ${SM.i?'':'disabled style="opacity:.4"'}>← Anterior</button>
    <span class="muted" id="tm" style="font-size:13px;align-self:center"></span>
    ${SM.i<39?`<button class="btn sm" onclick="simMove(1)">Siguiente →</button>`:`<button class="btn sm pri" onclick="simEnd()">Terminar ✓</button>`}</div>
    <div class="dots">${SM.ids.map((x,k)=>`<i style="cursor:pointer;${k===SM.i?'outline:2px solid var(--ac)':''}" class="${SM.ans[x]!==undefined?'o':''}" onclick="SM.i=${k};renderSim()"></i>`).join('')}</div>`;
  renderQ(q,SM.orders[id],'Simulacro de examen',Object.keys(SM.ans).length,40,'pickSim',extra);
  if(SM.ans[id]!==undefined) document.querySelector(`.opt[data-oi="${SM.ans[id]}"]`).classList.add('sel');
  tick();
}
function tick(){const e=$('#tm');if(!e||!SM)return;const s=((Date.now()-SM.t0)/1000)|0;e.textContent=`⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
setInterval(tick,1000);
function pickSim(oi,el){
  SM.ans[SM.ids[SM.i]]=oi;
  document.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');
  setTimeout(()=>{ if(SM.i<39){SM.i++;renderSim()} else if(Object.keys(SM.ans).length===40) simEnd(); },220);
}
function simMove(d){SM.i=Math.max(0,Math.min(39,SM.i+d));renderSim()}
function simEnd(){
  let score=0; const wrong=[];
  SM.ids.forEach(id=>{const q=BYID[id];const a=SM.ans[id];S.seen[id]=(S.seen[id]||0)+1;
    if(a===q.a){score++;S.box[id]=Math.min(3,(S.box[id]||0)+1)} else {wrong.push(id);S.box[id]=0;S.wrong[id]=(S.wrong[id]||0)+1}});
  const mins=Math.round((Date.now()-SM.t0)/60000);
  S.sims.push({score,date:Date.now(),mins}); save();
  const cls=score>=38?'ok':score>=35?'mid':'bad', msg=score>=38?'¡Nivel examen! Repite hasta lograrlo 3 veces seguidas.':score>=35?'Aprobarías, pero sin margen. Repasa tus errores.':'Aún no aprobarías (mínimo 35). Repasa tus errores.';
  const hist=S.sims.slice(-10).map(s=>`<span class="pill ${s.score>=38?'ok':s.score>=35?'mid':'bad'}" style="margin:2px">${s.score}</span>`).join('');
  app.innerHTML=`<div class="card" style="text-align:center">
    <div class="big">${score}/40</div><p><span class="pill ${cls}">${score>=35?'APROBADO':'DESAPROBADO'}</span></p>
    <p class="muted">${msg} · ${mins} min</p><div>${hist}</div>
    <div class="row" style="justify-content:center;margin-top:12px">
      ${wrong.length?`<button class="btn pri" onclick='startLearn("Errores del simulacro",${JSON.stringify(wrong)})'>Practicar mis ${wrong.length} errores</button>`:''}
      <button class="btn" onclick="startSim()">Otro simulacro</button><button class="btn" onclick="home()">Inicio</button></div></div>
    ${wrong.length?`<div class="card list"><h2>Revisión de errores</h2>${wrong.map(id=>{const q=BYID[id];const a=SM.ans[id];return `<div class="it"><div>${esc(q.q)}</div>${(IMG[id]||[]).map(s=>`<img src="${s}" style="max-height:90px;background:#fff;border-radius:8px;margin:6px 0">`).join('')}<div style="color:var(--bad);font-size:14px">Tu respuesta: ${a===undefined?'(en blanco)':esc(q.o[a])}</div><div class="a">✓ ${esc(q.o[q.a])}</div></div>`}).join('')}</div>`:''}`;
  SM=null;
}

/* ---------- LECTURA RÁPIDA ---------- */
function listView(filter=''){
  const f=filter.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const items=QS.filter(q=>!f||norm(q.q+' '+q.o[q.a]).includes(f));
  app.innerHTML=`<div class="top"><button class="btn sm" onclick="home()">✕</button><input type="search" id="sr" placeholder="Buscar (ej: semáforo, UIT, jornada)…" value="${esc(filter)}"></div>
  <div class="card list"><p class="muted" style="margin:0 0 6px;font-size:13px">${items.length} preguntas · solo se muestra la respuesta correcta. Lee la pregunta, di la respuesta en voz alta y luego mira.</p>
  ${items.map(q=>`<div class="it"><span class="tag">${q.part===1?'G':'E'}${q.n}</span>${mastered(q)?'<span class="tag done">✓ dominada</span>':''}<div>${esc(q.q)}</div>${(IMG[q.id]||[]).map(s=>`<img src="${s}" style="max-height:90px;background:#fff;border-radius:8px;margin:6px 0">`).join('')}<div class="a">→ ${esc(q.o[q.a])}</div>${q.base?`<div class="muted" style="font-size:12.5px">${esc(q.base)}</div>`:''}</div>`).join('')}</div>`;
  const sr=$('#sr'); sr.oninput=()=>{clearTimeout(sr._t);sr._t=setTimeout(()=>{listView(sr.value);const n=$('#sr');n.focus();n.setSelectionRange(n.value.length,n.value.length)},250)};
}

/* ---------- PLAN Y TRUCOS ---------- */
function tipsView(){
  app.innerHTML=`<div class="top"><button class="btn sm" onclick="home()">✕</button><b>Plan y trucos</b></div>
  <div class="card"><h2>Por qué funciona</h2>
  <p>El examen saca sus 40 preguntas <b>de este mismo balotario</b> (20 de generales y 20 de específicas). No necesitas entender todo el reglamento: necesitas <b>reconocer al instante</b> la respuesta de 270 preguntas. Para eso se usan tres técnicas con mucha evidencia:</p>
  <ol class="plan"><li><b>Recuerdo activo</b>: responder antes de ver la respuesta fija mucho más que releer.</li>
  <li><b>Repetición espaciada</b>: si fallas, la pregunta vuelve a las 3; si aciertas, vuelve más tarde para confirmar. Solo cuenta como dominada con 2 aciertos seguidos.</li>
  <li><b>Simulacros</b>: practicar en formato de examen (40 preguntas, sin ayuda) hasta sacar 38+ tres veces seguidas.</li></ol></div>
  <div class="card"><h2>Plan exprés (1 día intenso o 3 días tranquilos)</h2>
  <ol class="plan">
   <li><b>Bloque 0 (20 min):</b> Lectura rápida de las 67 preguntas de <b>señales</b> y luego modo 🚦 Señales.</li>
   <li><b>Día 1:</b> Generales 1–100 (4 bloques de 25). Cada bloque toma 15–25 min. Pausa de 5 min entre bloques.</li>
   <li><b>Día 2:</b> Generales 101–200 y Específicas 1–71. Antes de empezar, 10 min de 🔁 Mis errores de ayer.</li>
   <li><b>Día 3:</b> Simulacros. Después de cada uno, practica sus errores. Meta: <b>38+ tres veces seguidas</b>.</li>
   <li><b>Antes de dormir:</b> 10 min de 🔁 Mis errores. El sueño consolida lo estudiado ese día.</li>
   <li><b>Mañana del examen:</b> un simulacro de calentamiento y 🔁 errores. Nada nuevo.</li></ol>
   <p class="muted" style="font-size:13px">Versión 1 día: haz Día 1 + Día 2 en la mañana y tarde, y simulacros en la noche. Es posible, pero 2–3 días da un resultado más seguro.</p></div>
  <div class="card"><h2>Patrones del balotario (analizados de las 270)</h2>
  <ol class="plan">
   <li><b>"Ninguna de las alternativas es correcta"</b> aparece en 88 preguntas y es la correcta <b>solo en 3</b>. Si dudas, descártala.</li>
   <li><b>"Todas las anteriores / son correctas"</b> acierta en 14 de 29: no es automática, léela bien.</li>
   <li>La respuesta más larga es la correcta en 88 de 270 (33%): no sirve como truco, mejor aprende el contenido.</li>
   <li>Las específicas son sobre todo <b>números</b>: edades (70 máx., exámenes desde 65), multas en UIT, % de parabrisas, horas de conducción, M2 vs M3 (5 toneladas). Usa la 📖 Lectura rápida y busca "UIT", "años", "horas".</li>
   <li>Lee la palabra trampa: <b>"no"</b>, <b>"incorrecta"</b>, <b>"excepto"</b>. Varias preguntas piden la alternativa que NO corresponde.</li></ol></div>
  <div class="card"><h2>Úsala como app</h2><p class="muted" style="margin:0">Ábrela en el celular y elige "Agregar a pantalla de inicio". En la PC funciona con teclado (1–4 y Enter), más rápido que con el mouse.</p></div>`;
}

/* ---------- teclado ---------- */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  const map={'1':0,'2':1,'3':2,'4':3,a:0,b:1,c:2,d:3};
  const k=e.key.toLowerCase();
  if(k in map){const b=document.querySelectorAll('.opt')[map[k]]; if(b&&!b.disabled) b.click();}
  if(e.key==='Enter'){const n=$('#nx'); if(n){e.preventDefault();n.click();}}
  if(SM&&e.key==='ArrowRight') simMove(1);
  if(SM&&e.key==='ArrowLeft') simMove(-1);
});
home();
</script>
</body>
