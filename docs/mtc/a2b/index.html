<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brevete A-IIb · Entrenador 38/40</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--tx:#e9ecf1;--mu:#9aa3b2;--ac:#f5b301;--ok:#22c55e;--bad:#ef4444;--bd:#2a2f3a;--r:14px}
@media (prefers-color-scheme: light){:root{--bg:#f4f5f7;--card:#fff;--card2:#f0f2f5;--tx:#151820;--mu:#5d6675;--bd:#dde1e7}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 90px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header .logo{width:38px;height:38px;border-radius:10px;background:var(--ac);color:#111;display:grid;place-items:center;font-weight:800}
header h1{font-size:17px;margin:0;line-height:1.2}
header small{color:var(--mu);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--bd);background:var(--card2);color:var(--tx);padding:12px 14px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;text-align:left}
@media (hover:hover){.btn:hover{border-color:var(--ac)}}
.btn.pri{background:var(--ac);color:#111;border-color:var(--ac)}
.btn.sm{padding:8px 11px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mode{display:flex;flex-direction:column;gap:4px;min-height:92px}
.mode b{font-size:15.5px}.mode span{font-size:13px;color:var(--mu);font-weight:500}
.stat{display:flex;gap:10px;flex-wrap:wrap}
.stat div{flex:1;min-width:90px;background:var(--card2);border-radius:12px;padding:10px}
.stat b{display:block;font-size:22px}.stat span{font-size:12.5px;color:var(--mu)}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.blk{padding:10px;font-size:14px}
.blk .bar{height:5px}
.q{font-size:18px;font-weight:600;margin:6px 0 12px}
.meta{font-size:12.5px;color:var(--mu);display:flex;justify-content:space-between;gap:8px}
.qimg{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:#fff;border-radius:12px;padding:10px;margin-bottom:12px}
.qimg img{max-width:100%;max-height:220px}
.opt{display:flex;gap:10px;width:100%;margin-bottom:8px;align-items:flex-start;font-weight:500}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card2))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card2))}
.opt.sel{border-color:var(--ac)}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:12px;margin-top:6px;font-size:14.5px;background:var(--card2)}
.fb.ok{border-left:4px solid var(--ok)}.fb.bad{border-left:4px solid var(--bad)}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--mu);margin-right:4px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;display:flex;align-items:center;gap:10px}
.top .bar{flex:1;margin:0}
.muted{color:var(--mu)}
h2{font-size:16px;margin:0 0 10px}
ol.plan{margin:0;padding-left:20px}ol.plan li{margin-bottom:8px}
.done{color:var(--ok)}
.list .it{border-bottom:1px solid var(--bd);padding:10px 0}
.list .it .a{color:var(--ok);font-weight:600}
input[type=search]{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font:inherit}
.big{font-size:44px;font-weight:800;line-height:1}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-weight:700;font-size:13px}
.pill.ok{background:var(--ok);color:#06240f}.pill.bad{background:var(--bad);color:#fff}.pill.mid{background:var(--ac);color:#111}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.dots i{width:16px;height:16px;border-radius:4px;background:var(--card2);display:block}
.dots i.o{background:var(--ok)}.dots i.x{background:var(--bad)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mu)}
kbd{font-size:11px;border:1px solid var(--bd);border-radius:4px;padding:0 4px}
.hidekbd kbd{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const QS=[{"id": "1-1", "part": 1, "n": 1, "q": "Está permitido en la vía:", "o": ["Recoger o dejar pasajeros o carga en cualquier lugar", "Dejar animales sueltos o situarlos de forma tal que obstaculicen solo un poco el tránsito", "Recoger o dejar pasajeros en lugares autorizados.", "Ejercer el comercio ambulatorio o estacionario"], "a": 2, "base": ""}, {"id": "1-2", "part": 1, "n": 2, "q": "Respecto de los dispositivos de control o regulación del tránsito:", "o": ["Solo los peatones están obligados a su obediencia", "Los conductores y los peatones están obligados a su obediencia, salvo instrucción de la Policía Nacional del Perú asignada al tránsito que indique lo contrario", "Solo los conductores están obligados a su obediencia.", "Los conductores están obligados a su obediencia, aun cuando la Policía Nacional del Perú asignada al tránsito pueda indicar lo contrario."], "a": 1, "base": ""}, {"id": "1-3", "part": 1, "n": 3, "q": "La señal vertical reglamentaria R-6 ¿prohibido voltear a la izquierda¿, significa que:", "o": ["Está prohibido voltear a la izquierda y, por lo tanto también está prohibido el giro en U.", "Está prohibido voltear a la izquierda, sin embargo, está permitido el giro en U.", "El único sentido de desplazamiento es continuar de frente.", "Ninguna de las alternativas es correcta."], "a": 0, "base": ""}, {"id": "1-4", "part": 1, "n": 4, "q": "La señal vertical reglamentaria R-3 significa que:", "o": ["Nos acercamos a una zona restringida al tránsito.", "Está permitido adelantar vehículos.", "El único sentido de desplazamiento es continuar de frente.", "Ninguna de las alternativas es correcta"], "a": 2, "base": ""}, {"id": "1-5", "part": 1, "n": 5, "q": "En las vías, las marcas en el pavimento que son del tipo central discontinua y de color amarillo significan que:", "o": ["Está permitido cruzar al otro carril para el adelantamiento vehicular, si es que es seguro hacerlo.", "No está permitido cruzar al otro carril para el adelantamiento vehicular.", "Se está reduciendo el ancho de la calzada de la vía por donde se circula.", "Se está frente a un lugar de cruce peatonal."], "a": 0, "base": ""}, {"id": "1-6", "part": 1, "n": 6, "q": "El color ámbar o amarillo del semáforo significa que:", "o": ["Los vehículos deben avanzar.", "Los vehículos deben detenerse.", "Los vehículos deben acelerar la marcha.", "Los vehículos deben detenerse antes de ingresar a la intersección si su velocidad y ubicación lo permiten; de lo contrario, deberán cruzar y despejar la intersección."], "a": 3, "base": ""}, {"id": "1-7", "part": 1, "n": 7, "q": "Los colores del semáforo tienen el siguiente significado: rojo: _____ ; ámbar o amarillo: _____; verde: ____.", "o": ["Detención - prevención - paso.", "Detención - paso con prevención - circulación rápida.", "Disminución de la velocidad - prevención - paso rápido.", "Ninguna de las alternativas es correcta."], "a": 0, "base": ""}, {"id": "1-8", "part": 1, "n": 8, "q": "¿Qué indica una flecha verde en un semáforo vehicular?", "o": ["Se puede continuar con precaución únicamente en la dirección de la flecha y desde el carril que esta flecha controla.", "No está permitida la circulación en el sentido que indica la flecha.", "Se debe respetar únicamente la luz circular.", "Ninguna de las alternativas es correcta."], "a": 0, "base": ""}, {"id": "1-9", "part": 1, "n": 9, "q": "La siguiente señal vertical reglamentaria R-53:", "o": ["Prohíbe estacionar.", "Prohíbe al conductor detener el vehículo dentro del área de la intersección.", "Prohíbe la carga y descarga.", "Prohíbe la circulación de vehículos motorizados"], "a": 1, "base": ""}, {"id": "1-10", "part": 1, "n": 10, "q": "Si llega a una intersección y visualiza el semáforo con una flecha roja hacia la izquierda y la luz circular verde prendidas al mismo tiempo, la acción correcta es:", "o": ["Avanzar en cualquier sentido, ya que la luz circular está en verde.", "Avanzar, pero el giro a la izquierda está prohibido por la flecha roja.", "Avanzar únicamente hacia la izquierda, pues continuar de frente está prohibido.", "Ninguna de las alternativas es correcta."], "a": 1, "base": ""}, {"id": "1-11", "part": 1, "n": 11, "q": "Si llega a una intersección donde el semáforo muestra una luz intermitente, qué afirmación es correcta:", "o": ["Si la luz intermitente es roja, ésta es equivalente a un ¿CEDA EL PASO?", "Si la luz intermitente es ámbar, tiene preferencia, debiendo reducir la velocidad y continuar con precaución.", "Si la luz intermitente es verde, ésta es equivalente a un “PARE”.", "Ninguna de las alternativas es correcta."], "a": 1, "base": ""}, {"id": "1-12", "part": 1, "n": 12, "q": "¿La luz intermitente roja es igual que una señal de PARE?", "o": ["Verdad.", "Es verdad siempre y cuando también se encuentre un Policía de Tránsito indicando la señal de Pare.", "Falso", "Ninguna de las alternativas es correcta."], "a": 0, "base": ""}, {"id": "1-13", "part": 1, "n": 13, "q": "Al aproximarse a una intersección con giro permitido a la izquierda, la conducta correcta es:", "o": ["Girar desde cualquier carril.", "Colocarse en el carril derecho, luego girar con precaución.", "Colocarse en el carril más despejado de tráfico, luego girar con precaución.", "Hacer la señal de volteo a la izquierda con las luces direccionales, ubicar con antelación el vehículo en el carril de circulación de la izquierda y girar con precaución."], "a": 3, "base": ""}, {"id": "1-14", "part": 1, "n": 14, "q": "Al cambiar de carril en una vía de un solo sentido con múltiples carriles, ¿cuál es la conducta correcta?", "o": ["Se deben encender las luces direccionales primero, buscar una brecha y realizar el cambio de carril con precaución.", "Se debe encontrar una brecha, luego cambiar de carril con precaución; no es necesario el uso de luces direccionales para cambios de carril.", "Se debe advertir utilizando el claxon, identificar una brecha y realizar el cambio de carril con precaución.", "Está prohibido el cambio de carril en vías de un solo sentido."], "a": 0, "base": ""}, {"id": "1-15", "part": 1, "n": 15, "q": "Respecto a los cruces a nivel con vías férreas, señale la afirmación correcta:", "o": ["Los vehículos que transitan por la vía férrea tienen preferencia de paso sobre los que transitan por la vía que la cruza.", "Los vehículos que transitan por la vía que cruza la línea férrea tienen preferencia de paso sobre los que transitan por la vía férrea.", "El vehículo que llegue primero tiene preferencia.", "Tiene preferencia el conductor que viene por la derecha del otro."], "a": 0, "base": ""}, {"id": "1-16", "part": 1, "n": 16, "q": "Ante la señal de color rojo del semáforo y la indicación de continuar la marcha del efectivo de la Policía Nacional del Perú asignado al control del tránsito, corresponde:", "o": ["Detenerse hasta que cambie a luz verde.", "Continuar la marcha.", "Estar prevenido.", "Ninguna de las alternativas es correcta."], "a": 1, "base": ""}, {"id": "1-17", "part": 1, "n": 17, "q": "Está prohibido estacionar un vehículo:", "o": ["En las curvas.", "Dentro de una intersección.", "Frente a la entrada de garajes y de recintos militares o policiales.", "Todas las alternativas son correctas."], "a": 3, "base": ""}, {"id": "1-18", "part": 1, "n": 18, "q": "La siguiente señal vertical reglamentaria (R-29):", "o": ["Prohíbe el uso de la bocina en vías urbanas.", "Prohíbe el uso de la bocina en carreteras.", "Prohíbe el uso de la bocina.", "Prohíbe hacer ruido."], "a": 2, "base": ""}, {"id": "1-19", "part": 1, "n": 19, "q": "Se le impondrá el pago de una multa y no podrá obtener la licencia de conducir por 3 años a la persona que:", "o": ["Conduzca un vehículo automotor sin tener licencia de conducir.", "Conduzca un vehículo que no cuente con el equipamiento para brindar una máxima comodidad a sus ocupantes.", "Conduzca un vehículo sin contar con el SOAT.", "a y c son correctas"], "a": 0, "base": ""}, {"id": "1-20", "part": 1, "n": 20, "q": "En el supuesto que se encuentre manejando y un vehículo que tiene la intención de sobrepasarlo o adelantarlo lo alcance, ¿qué debería hacer usted?", "o": ["Debe aumentar la velocidad para no dejar que el otro vehículo lo pase.", "No debe aumentar la velocidad hasta que el vehículo lo sobrepase.", "Debe disminuir drásticamente la velocidad de su vehículo.", "Debe detener su vehículo."], "a": 1, "base": ""}, {"id": "1-21", "part": 1, "n": 21, "q": "¿Cuál de las siguientes afirmaciones es correcta?", "o": ["El conductor debe respetar los límites máximos y mínimos de velocidad establecidos.", "El conductor debe respetar únicamente los límites máximos de velocidad, pues no existen límites mínimos.", "El conductor puede conducir a la velocidad que desee, siempre que lo haga de manera prudente.", "Ninguna de las alternativas es correcta."], "a": 0, "base": ""}, {"id": "1-22", "part": 1, "n": 22, "q": "¿Qué luces debe utilizar un conductor que circula en las vías públicas urbanas por la noche?", "o": ["Bajas.", "Altas.", "Luces altas en las intersecciones y bajas en las avenidas.", "Ninguna de las alternativas es correcta."], "a": 0, "base": ""}, {"id": "1-23", "part": 1, "n": 23, "q": "En caso de accidentes, el SOAT cubre los daños que sufren:", "o": ["Solo los ocupantes del vehículo.", "Los ocupantes y terceros no ocupantes del vehículo.", "Solo terceros afectados.", "Solo el conductor del vehículo."], "a": 1, "base": ""}, {"id": "1-24", "part": 1, "n": 24, "q": "¿Cuál de los siguientes seguros es exigible para conducir un vehículo automotor?", "o": ["Cualquier tipo de seguro de accidentes personales que comercialicen las empresas de seguro.", "Cualquier tipo de seguro vehicular, siempre que cubra a los ocupantes del vehículo y terceros afectados por un accidente de tránsito.", "El Seguro Obligatorio de Accidentes de Tránsito - SOAT.", "No es obligatorio contar con un seguro."], "a": 2, "base": ""}, {"id": "1-25", "part": 1, "n": 25, "q": "Cuándo es obligatorio darle preferencia de paso a un vehículo de emergencia o vehículo oficial:", "o": ["Cuando emita señales visibles.", "Cuando emita señales audibles.", "Cuando emita señales audibles y visibles.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-26", "part": 1, "n": 26, "q": "Si por el carril por donde está conduciendo se aproxima a un vehículo de transporte escolar que se encuentra detenido, recogiendo o dejando escolares ¿Qué debe hacer?", "o": ["Detener el vehículo y no continuar la marcha hasta que haya culminado el ascenso o descenso de los escolares.", "Adelantar por el lado izquierdo, pero con precaución.", "Tocar el claxon para alertar que está pasando.", "Adelantar muy despacio."], "a": 0, "base": ""}, {"id": "1-27", "part": 1, "n": 27, "q": "¿Qué significa un triángulo rojo de seguridad colocado en la calzada?", "o": ["La presencia de un vehículo inmovilizado en la vía pública por alguna circunstancia.", "Zona de obras por reparación en la calzada.", "Que el vehículo que lo enfrenta debe detenerse.", "a y c son correctas."], "a": 0, "base": ""}, {"id": "1-28", "part": 1, "n": 28, "q": "La siguiente señal vertical reglamentaria P-22C indica que:", "o": ["Está permitido adelantar.", "Se aproxima un carril adicional.", "Está permitido cambiar de carril.", "Ninguna de las alternativas es correcta."], "a": 1, "base": ""}, {"id": "1-29", "part": 1, "n": 29, "q": "Las luces intermitentes de emergencia del vehículo deben utilizarse obligatoriamente:", "o": ["Para girar en las intersecciones y para advertir los cambios de carril.", "Para indicar la detención, parada o estacionamiento en zona peligrosa o la ejecución de maniobras riesgosas.", "Durante toda la circulación del vehículo.", "En cada intersección."], "a": 1, "base": ""}, {"id": "1-30", "part": 1, "n": 30, "q": "En intersecciones que no tienen señales de Pare, Ceda el Paso o Semáforo, ¿las vías de doble sentido tienen prioridad de paso respecto a las vías de un solo sentido de igual clasificación?", "o": ["No.", "Si.", "Depende de la intersección.", "No se encuentra regulado en el reglamento."], "a": 1, "base": ""}, {"id": "1-31", "part": 1, "n": 31, "q": "Si usted se aproxima a una señal de PARE colocada verticalmente o pintada en la vía, la acción correcta es:", "o": ["Disminuir su velocidad y cederle el paso a los vehículos que circulan por la transversal.", "Disminuir su velocidad y pasar con cuidado.", "Sobre parar y pasar rápidamente.", "Parar por completo, ceder el paso a los usuarios que tengan preferencia y luego continuar con precaución."], "a": 3, "base": ""}, {"id": "1-32", "part": 1, "n": 32, "q": "¿Cuál es la diferencia entre las señales P-2A y P-1A?", "o": ["No hay diferencia, se usan indistintamente.", "La señal P-2A se utiliza en situaciones de mayor riesgo.", "La señal P-1A advierte la presencia de curva pronunciada a la derecha mientras que la P-2A advierte la presencia de curva suave a la derecha.", "La señal P-2A advierte la presencia de curva pronunciada a la derecha mientras que la P-1A advierte la presencia de curva suave a la derecha."], "a": 2, "base": ""}, {"id": "1-33", "part": 1, "n": 33, "q": "¿Qué indica la señal R-30F?", "o": ["Tener precaución con vehículos lentos.", "Regula la velocidad máxima permitida en curvas.", "Regula la velocidad máxima en zonas rurales.", "No se encuentra regulada en el reglamento."], "a": 1, "base": ""}, {"id": "1-34", "part": 1, "n": 34, "q": "¿Qué señal debe utilizar el conductor para disminuir la velocidad o detener el vehículo cuando está en marcha?", "o": ["Luces direccionales.", "Solo el antebrazo izquierdo y mano extendidos hacia abajo fuera del vehículo.", "Luces intermitentes y, en caso de fuerza mayor, utilizar el antebrazo izquierdo y mano extendidos hacia abajo fuera del vehículo, haciendo ángulo recto con el brazo.", "Luces bajas."], "a": 2, "base": ""}, {"id": "1-35", "part": 1, "n": 35, "q": "Si dos vehículos se aproximan simultáneamente a una intersección no regulada (sin señalización) procedentes de vías diferentes, ¿quién tiene preferencia de paso?", "o": ["Cualquiera de los dos.", "El que se aproxime por la derecha del otro.", "El que se aproxime por la izquierda del otro.", "El que haga sonar la bocina primero."], "a": 1, "base": ""}, {"id": "1-36", "part": 1, "n": 36, "q": "En una intersección no regulada (sin señalización) tiene preferencia de paso:", "o": ["El vehículo que ingresó primero a la intersección.", "El vehículo que haga sonar la bocina primero.", "El vehículo que haga cambio de luces primero.", "Cualquier vehículo"], "a": 0, "base": ""}, {"id": "1-37", "part": 1, "n": 37, "q": "En una rotonda, tiene prioridad de paso el vehículo que:", "o": ["Quiere ingresar a la rotonda.", "Circula por ella.", "Acelera primero.", "Hace sonar la bocina."], "a": 1, "base": ""}, {"id": "1-38", "part": 1, "n": 38, "q": "El sobrepaso o adelantamiento de un vehículo en movimiento se efectúa, salvo excepciones, por la _________ retornando el vehículo después de la maniobra a su carril original.", "o": ["Derecha.", "Izquierda.", "Berma", "Por la derecha o izquierda."], "a": 1, "base": ""}, {"id": "1-39", "part": 1, "n": 39, "q": "Si un conductor está tomando medicamentos y por ello siente sueño ¿qué debe hacer?", "o": ["Manejar normalmente.", "Manejar despacio.", "Abstenerse de manejar.", "Manejar con un copiloto."], "a": 2, "base": ""}, {"id": "1-40", "part": 1, "n": 40, "q": "Son documentos que deben portarse obligatoriamente, durante la conducción del vehículo, y exhibirse cuando la autoridad competente lo solicite:", "o": ["Documento de identidad, SOAT vigente (puede ser virtual) y tarjeta de identificación vehicular.", "Certificado de Inspección Técnica Vehicular y contrato de compraventa del vehículo.", "Contrato de compraventa del vehículo.", "Todas las alternativas son correctas."], "a": 0, "base": ""}, {"id": "1-41", "part": 1, "n": 41, "q": "En los tramos de una vía con pendiente pronunciada, que permite la circulación de un solo vehículo, se debe de tener en cuenta que el vehículo que asciende respecto al vehículo que desciende:", "o": ["No tiene preferencia de paso.", "Tiene preferencia de paso.", "Debe detenerse.", "Debe retroceder."], "a": 1, "base": ""}, {"id": "1-42", "part": 1, "n": 42, "q": "Al cambiar de dirección, un conductor debe:", "o": ["Señalizar toda la maniobra hasta su culminación.", "Cambiar de dirección y luego señalizar.", "No existe ninguna obligación.", "Ninguna de las alternativas es correcta."], "a": 0, "base": ""}, {"id": "1-43", "part": 1, "n": 43, "q": "¿Se puede conducir un vehículo con el motor en punto neutro?", "o": ["Sí, pero solo si está bajando una pendiente.", "No, está prohibido.", "Sí, en caso de que el conductor no sea novato.", "No se encuentra regulado en la norma."], "a": 1, "base": ""}, {"id": "1-44", "part": 1, "n": 44, "q": "Para girar o cambiar de carril hacia la derecha, el conductor debe utilizar las luces direccionales y, en casos de fuerza mayor, la siguiente señal manual:", "o": ["Brazo, antebrazo izquierdo y mano extendidos hacia afuera del vehículo.", "Antebrazo izquierdo y mano extendidos hacia arriba fuera del vehículo, formando un ángulo recto con el brazo.", "Brazo, antebrazo derecho y mano extendidos hacia afuera del vehículo.", "Ninguna de las alternativas es correcta."], "a": 1, "base": ""}, {"id": "1-45", "part": 1, "n": 45, "q": "Si la licencia de conducir no se encuentra vigente, los vehículos que autoriza a conducir dicha licencia:", "o": ["No podrán ser conducidos.", "Podrán ser conducidos únicamente en zonas urbanas.", "Podrán ser conducidos hasta por 90 días posteriores a la pérdida de vigencia de la licencia.", "Podrán ser conducidos con normalidad hasta que renueve su licencia."], "a": 0, "base": ""}, {"id": "1-46", "part": 1, "n": 46, "q": "De acuerdo con el sistema de control de licencias de conducir por puntos:", "o": ["Determinadas infracciones suman puntos.", "Una infracción puede sumar o disminuir puntos, a elección del infractor.", "Determinadas infracciones restan puntos.", "Ninguna de las alternativas es correcta."], "a": 0, "base": ""}, {"id": "1-47", "part": 1, "n": 47, "q": "¿Cuál es la consecuencia de acumular 100 puntos en la licencia de conducir en un período de 24 meses?", "o": ["Suspensión de licencia de conducir.", "Anulación de la Placa Única Nacional de Rodaje.", "Inhabilitación definitiva para obtener una licencia de conducir.", "Internamiento vehicular."], "a": 0, "base": ""}, {"id": "1-48", "part": 1, "n": 48, "q": "Se entiende por carril a la:", "o": ["Parte de la vía destinada a la circulación de peatones.", "Parte de la calzada destinada al tránsito de una fila de vehículos.", "Vía rural destinada a la circulación de peatones y animales.", "Todas las alternativas son correctas."], "a": 1, "base": ""}, {"id": "1-49", "part": 1, "n": 49, "q": "Se entiende por línea de parada a:", "o": ["La línea transversal marcada en la calzada antes de la intersección, que indica al conductor el límite para detener el vehículo.", "Las líneas que se encuentran en los lugares del estacionamiento.", "El lugar utilizado para embarcar y desembarcar pasajeros.", "Todas las alternativas son correctas."], "a": 0, "base": ""}, {"id": "1-50", "part": 1, "n": 50, "q": "La siguiente señal vertical reglamentaria P-17A, indica:", "o": ["Reducción de la calzada al lado derecho.", "Reducción de la calzada al lado izquierdo.", "Reducción de la calzada en ambos lados.", "Ensanchamiento de la calzada en ambos lados."], "a": 2, "base": ""}, {"id": "1-51", "part": 1, "n": 51, "q": "En caso de encontrar marcación de doble línea amarilla compuesta por un trazo continuo y otro trazo discontinuo en una vía de doble sentido, ¿qué se debe hacer?", "o": ["Se puede adelantar en ambos sentidos.", "No está permitido adelantar en ningún sentido.", "Respetar la línea que está de su lado (si es continua, no adelantar; si es discontinua, está permitido adelantar).", "Respetar la línea que está de su lado (si es discontinua, no adelantar; si es continua, está permitido adelantar)"], "a": 2, "base": ""}, {"id": "1-52", "part": 1, "n": 52, "q": "Se define como zona rígida al:", "o": ["Área donde se prohíbe la circulación de vehículos.", "Área donde se prohíbe la circulación de peatones.", "Área de la vía en la que se prohíbe el estacionamiento de vehículos.", "Todas las alternativas son correctas."], "a": 2, "base": ""}, {"id": "1-53", "part": 1, "n": 53, "q": "La posición de frente o de espaldas ejecutada por el efectivo de la Policía Nacional del Perú asignado al control de tránsito significa:", "o": ["Obligación de detenerse de quien así lo enfrente.", "Continuar la marcha por el carril izquierdo de la calzada.", "Continuar la marcha.", "Ninguna de las alternativas es correcta."], "a": 0, "base": ""}, {"id": "1-54", "part": 1, "n": 54, "q": "Siempre que no exista una señal de límite de velocidad, en zonas urbanas el límite máximo de velocidad en calles y jirones es de:", "o": ["30km/h.", "40km/h.", "60km/h.", "80km/h."], "a": 1, "base": ""}, {"id": "1-55", "part": 1, "n": 55, "q": "Siempre que no exista una señal de límite de velocidad, en zonas urbanas el límite máximo de velocidad en avenidas es de:", "o": ["30km/h.", "40km/h.", "60km/h.", "80km/h."], "a": 2, "base": ""}, {"id": "1-56", "part": 1, "n": 56, "q": "Siempre que no exista una señal de límite de velocidad, en zonas urbanas el límite máximo de velocidad en vías expresas es de:", "o": ["60km/h.", "70km/h.", "80km/h.", "100km/h."], "a": 2, "base": ""}, {"id": "1-57", "part": 1, "n": 57, "q": "Siempre que no exista una señal de límite de velocidad en zonas urbanas, el límite máximo de velocidad en zona escolar es de:", "o": ["20km/h.", "30km/h.", "35km/h.", "50km/h."], "a": 1, "base": ""}, {"id": "1-58", "part": 1, "n": 58, "q": "Siempre que no exista una señal de límite de velocidad en carreteras, el límite máximo de velocidad para automóviles, camionetas y motocicletas es de:", "o": ["80km/h.", "90km/h.", "100km/h.", "110km/h."], "a": 2, "base": ""}, {"id": "1-59", "part": 1, "n": 59, "q": "Siempre que no exista una señal de límite de velocidad mínima, el límite mínimo de velocidad en zona urbana y en carreteras es de:", "o": ["30km/h.", "La mitad de la velocidad máxima establecida para cada tipo de vía.", "20 km/h.", "15 km/h."], "a": 1, "base": ""}, {"id": "1-60", "part": 1, "n": 60, "q": "¿Cuál es la sanción por conducir con presencia de alcohol en la sangre en proporción mayor a lo previsto en el Código Penal, o bajo los efectos de estupefacientes, narcóticos y/o alucinógenos comprobados con el examen respectivo, o por negarse al mismo y que haya participado en un accidente de tránsito?", "o": ["Multa.", "Cancelación de licencia de conducir.", "Suspensión de la licencia de conducir.", "Multa, cancelación de la licencia de conducir e inhabilitación definitiva para obtener una licencia de conducir."], "a": 3, "base": ""}, {"id": "1-61", "part": 1, "n": 61, "q": "¿Cuál es la sanción si en un operativo de alcoholemia usted es intervenido y se comprueba que ha consumido alcohol por encima del límite legal, o está conduciendo bajo los efectos de estupefacientes, narcóticos y/o alucinógenos comprobada con el examen respectivo?", "o": ["Una multa", "La suspensión de la licencia de conducir.", "Multa y suspensión de la licencia de conducir por 3 años.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-62", "part": 1, "n": 62, "q": "La frecuencia de la inspección técnica de un vehículo particular es:", "o": ["Cada medio año.", "Cada año.", "Cada dos años.", "Cada tres años."], "a": 1, "base": ""}, {"id": "1-63", "part": 1, "n": 63, "q": "¿A partir de qué año de antigüedad debe realizarse la inspección técnica de un vehículo particular para transporte de personas de hasta 9 asientos incluido el conductor de la categoría M1?", "o": ["A partir del segundo año contado desde el año siguiente de su fabricación.", "A partir del cuarto año contado desde el año siguiente de su fabricación.", "A partir del quinto año contado desde el año siguiente de su fabricación.", "No está sujeto a inspección técnica."], "a": 1, "base": ""}, {"id": "1-64", "part": 1, "n": 64, "q": "¿Cuál es el plazo de vigencia del SOAT?", "o": ["1 año.", "6 meses.", "4 años.", "2 años."], "a": 0, "base": ""}, {"id": "1-65", "part": 1, "n": 65, "q": "Si ocurre un accidente de tránsito, ¿qué obligación tiene el conductor, el propietario del vehículo o el prestador del servicio de transporte?", "o": ["Dar aviso a los bomberos.", "Dar aviso solo a la compañía de seguros.", "Dar aviso a la compañía de seguros y dejar constancia en la delegación de la Policía Nacional del Perú más cercana.", "Dar aviso únicamente a la Policía Nacional del Perú."], "a": 2, "base": ""}, {"id": "1-66", "part": 1, "n": 66, "q": "Si una licencia de conducir consiga alguna restricción, es correcto afirmar que:", "o": ["Dicha restricción es meramente informativa.", "Es una obligación cumplir con la restricción.", "Incumplir la restricción no genera un riesgo para la seguridad vial.", "Ninguna de las alternativas es correcta."], "a": 1, "base": ""}, {"id": "1-67", "part": 1, "n": 67, "q": "La señal preventiva P-33A, significa:", "o": ["Señal de curva sinuosa.", "Señal de proximidad a un badén.", "Señal de proximidad de un reductor de velocidad tipo resalto.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-68", "part": 1, "n": 68, "q": "Si su vehículo deja de funcionar o comienza a tener problemas y usted trata de moverlo al costado de la autopista, debe:", "o": ["Activar las luces intermitentes de emergencia.", "Parar en su posición actual.", "Salir del vehículo rápidamente.", "Ninguna de las alternativas es correcta."], "a": 0, "base": ""}, {"id": "1-69", "part": 1, "n": 69, "q": "¿Está permitido usar la bocina de su vehículo para advertir al conductor del vehículo que circula delante, que será adelantado?", "o": ["Sí, siempre y cuando el sonido no sea estridente.", "Si, salvo prohibición expresa mediante la correspondiente señal.", "No, está prohibido.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-70", "part": 1, "n": 70, "q": "Si observa que se aproxima una ambulancia sin las luces especiales encendidas y sin sirena, es correcto afirmar que:", "o": ["No estamos obligados a darle preferencia de paso.", "Estamos obligados a darle prioridad de paso por ser una ambulancia.", "Está informando que está en servicio de urgencia.", "Ninguna de las alternativas es correcta."], "a": 0, "base": ""}, {"id": "1-71", "part": 1, "n": 71, "q": "Si se encuentra en una intersección y se enciende la luz verde del semáforo y observa que en la calle transversal hay vehículos o personas despejando la intersección, ¿qué debe hacer?", "o": ["No iniciar la marcha hasta que el vehículo o las personas terminen de cruzar.", "Tocar el claxon para que se apuren en pasar.", "Bajar del vehículo y reclamar la falta al infractor.", "Ninguna de las alternativas es correcta."], "a": 0, "base": ""}, {"id": "1-72", "part": 1, "n": 72, "q": "En señalética vial, el color __________ en el pavimento es utilizado para carriles de tráfico en sentido opuesto y el color __________ en el pavimento es utilizado como separador de carriles de tráfico en el mismo sentido.", "o": ["Amarillo - blanco.", "Blanco - Amarillo.", "Azul - rojo.", "Rojo - Amarillo."], "a": 0, "base": ""}, {"id": "1-73", "part": 1, "n": 73, "q": "Si una fila de escolares cruza la calzada fuera del crucero peatonal, ¿qué acción se debe tomar?", "o": ["Advertir con el claxon.", "Advertir a viva voz.", "Parar y ceder el paso.", "Continuar la marcha lentamente."], "a": 2, "base": ""}, {"id": "1-74", "part": 1, "n": 74, "q": "Si se aproxima a una zona escolar, ¿qué acción debe realizar?", "o": ["No tiene ninguna obligación si no hay señalización.", "Disminuir la velocidad a 40 Km/h.", "Disminuir la velocidad a 30 Km/h.", "Disminuir la velocidad a 35 km/h."], "a": 2, "base": ""}, {"id": "1-75", "part": 1, "n": 75, "q": "Tienen el objetivo de notificar a los usuarios las limitaciones, prohibiciones o restricciones en el uso de la vía.", "o": ["Señales reguladoras o de reglamentación.", "Señales preventivas.", "Señales informativas.", "Señales horizontales."], "a": 0, "base": ""}, {"id": "1-76", "part": 1, "n": 76, "q": "Tienen el propósito de advertir a los usuarios sobre la existencia y naturaleza de un peligro en la vía.", "o": ["Señales reguladoras o de reglamentación.", "Señales preventivas.", "Señales informativas.", "Señales horizontales."], "a": 1, "base": ""}, {"id": "1-77", "part": 1, "n": 77, "q": "Es una infracción de tránsito:", "o": ["No detenerse totalmente en una señal de PARE.", "Arrojar, depositar o abandonar objetos o sustancias en la vía pública que dificulten la circulación.", "Utilizar la bocina para llamar la atención en forma innecesaria.", "Todas las alternativas son correctas."], "a": 3, "base": ""}, {"id": "1-78", "part": 1, "n": 78, "q": "¿Qué debería hacer el conductor al acercarse a una señal de “CEDA EL PASO” en una intersección?", "o": ["Ceder el paso a los vehículos de emergencia.", "Mantener la velocidad y avanzar con cuidado.", "Disminuir la velocidad, parar si es necesario y ceder el paso a los peatones o vehículos que circulan por la vía transversal.", "Parar totalmente y luego avanzar con cuidado."], "a": 2, "base": ""}, {"id": "1-79", "part": 1, "n": 79, "q": "No se debe conducir un vehículo:", "o": ["Si no se cuenta con el SOAT.", "En retroceso, salvo las excepciones que establece la norma.", "Si no se tiene la licencia para el tipo de vehículo que se quiere conducir.", "Todas son correctas."], "a": 3, "base": ""}, {"id": "1-80", "part": 1, "n": 80, "q": "¿Qué debe hacer si se aproxima a una intersección sin semáforo y sin presencia de la Policía de Tránsito, y observa que un peatón está cruzando por el paso peatonal?", "o": ["Disminuir la velocidad y pasar con cuidado.", "Detener el vehículo y ceder el paso al peatón.", "Continuar porque usted tiene la prioridad.", "Incrementar la velocidad para adelantar el cruce el peatón."], "a": 1, "base": ""}, {"id": "1-81", "part": 1, "n": 81, "q": "Sobre el uso del cinturón de seguridad en los vehículos que se encuentran en circulación, es correcto afirmar que:", "o": ["El uso del cinturón de seguridad es obligatorio para las personas que ocupen los asientos delanteros.", "En los asientos posteriores el uso del cinturón de seguridad es obligatorio en todos los vehículos cuando los tengan incorporados de fábrica y en los casos en que, de acuerdo a las normas se encuentren obligados a tenerlos.", "El uso del cinturón de seguridad no solo es obligatorio para el conductor.", "Todas las alternativas son correctas."], "a": 3, "base": ""}, {"id": "1-82", "part": 1, "n": 82, "q": "Si en una vía de dos carriles con tránsito en un mismo sentido usted se desplaza lentamente en su vehículo, debe circular por el carril de la _________ y los vehículos que circulen a mayor velocidad deben hacerlo por el carril de la ___________", "o": ["Izquierda / Derecha.", "Derecha / Derecha.", "Derecha / Izquierda.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-83", "part": 1, "n": 83, "q": "Sobre el uso de la bocina del vehículo, es correcto afirmar que:", "o": ["El conductor debe tratar de no utilizar la bocina para llamar la atención en forma innecesaria.", "El uso de la bocina para llamar la atención en forma innecesaria no es una infracción al tránsito.", "El conductor únicamente debe utilizar la bocina para evitar situaciones peligrosas.", "a y b son correctas."], "a": 2, "base": ""}, {"id": "1-84", "part": 1, "n": 84, "q": "Una línea blanca continua en el sentido longitudinal de una vía, que se coloca en el pavimento, le indica al conductor:", "o": ["Que se puede adelantar, debido a que la línea no es amarilla continua.", "Que está prohibido cruzar la línea y no hay excepciones.", "Que está prohibido pasar al otro lado de la línea con algunas excepciones.", "Que es zona de peatones."], "a": 2, "base": ""}, {"id": "1-85", "part": 1, "n": 85, "q": "¿Cuál es el número máximo de personas que puede transportar un vehículo particular?", "o": ["Es igual al número de asientos señalados en la tarjeta de identificación vehicular, con la excepción de niños en brazos en los asientos posteriores.", "No existe prohibición sobre un número máximo de personas que se puede transportar.", "La restricción sobre un número máximo de personas que se puede transportar se aplica para los asientos delanteros, para los asientos posteriores no hay restricción.", "Se puede transportar a todas las personas que entren en el vehículo, sin restricción, siempre y cuando no obstaculicen la visibilidad del conductor y todos sean de la misma familia."], "a": 0, "base": ""}, {"id": "1-86", "part": 1, "n": 86, "q": "La acción correcta al abastecer de combustible su vehículo, es:", "o": ["Asegurarse de que todos los pasajeros permanezcan a bordo del vehículo.", "Abstenerse de fumar tanto el conductor como sus acompañantes.", "Mantener encendido el motor del vehículo.", "Todas las alternativas son correctas."], "a": 1, "base": ""}, {"id": "1-87", "part": 1, "n": 87, "q": "Mientras usted está conduciendo su vehículo automotor, ¿puede llevar sujeto a su auto al conductor de una bicicleta mientras éste la conduce?", "o": ["Sí, siempre y cuando el conductor de la bicicleta se sujete a la parte posterior del auto, pero nunca a la parte lateral de éste.", "Sí, siempre y cuando se prevean todas las medidas de seguridad respectivas.", "Sí, siempre y cuando esta acción sea realizada a una velocidad no mayor a", "No, es una acción prohibida y quien la cometa puede ser sancionado con una multa."], "a": 3, "base": ""}, {"id": "1-88", "part": 1, "n": 88, "q": "Si usted desea realizar una competencia de carreras entre su vehículo y otro vehículo motorizado; para ello puede utilizar:", "o": ["Las vías aledañas del parque del distrito en el cual reside, en el horario de 11:00 pm. a 5:00 am.", "Un circuito de carrera, autódromo o pista de aceleración autorizado por la autoridad competente.", "Las vías aledañas del parque del distrito en el cual reside, siempre y cuando tenga el permiso municipal correspondiente.", "Todas las alternativas son correctas."], "a": 1, "base": ""}, {"id": "1-89", "part": 1, "n": 89, "q": "Señale cuáles de las siguientes conductas constituye una infracción al tránsito:", "o": ["Tener la puerta, capot o maletera del vehículo abierta, cuando el vehículo está en marcha.", "Conducir un vehículo lentamente por el carril de la izquierda causando congestión.", "Conducir un vehículo con el motor en punto neutro o apagado.", "Todas las alternativas son correctas."], "a": 3, "base": ""}, {"id": "1-90", "part": 1, "n": 90, "q": "La marcas en el pavimento constituyen un elemento indispensable para la operación vehicular, pues su función es:", "o": ["Reemplazar a la señalización vertical cuando ésta no se encuentra en la vía, por tal motivo son colocadas donde no existe señales verticales.", "Guiar a los usuarios únicamente en las vías que presentan peligros.", "Reglamentar la circulación, así como advertir y guiar a los usuarios de la vía.", "Todas las alternativas son correctas."], "a": 2, "base": ""}, {"id": "1-91", "part": 1, "n": 91, "q": "Las marcas en el pavimento de color __________ complementan las señales informativas, como por ejemplo las zonas de estacionamiento para personas con movilidad reducida.", "o": ["Blanco.", "Azul.", "Rojo.", "Gris."], "a": 1, "base": ""}, {"id": "1-92", "part": 1, "n": 92, "q": "La línea central de color amarillo en el pavimento es continua cuando:", "o": ["No está permitido cruzar al otro carril.", "Está permitido cruzar al otro carril para el adelantamiento.", "Se trata de una vía de doble sentido de circulación, que permite cruzar al otro carril.", "Separa corrientes de tráfico en el mismo sentido."], "a": 0, "base": ""}, {"id": "1-93", "part": 1, "n": 93, "q": "Si un conductor que circula por el carril derecho de una vía se encuentra con las flechas inclinadas que se muestran en la figura, su conducta correcta es:", "o": ["Continuar la circulación por el carril en que se encuentra.", "Adelantar al vehículo que se encuentra delante de él y que circula por el carril izquierdo.", "No adelantar al vehículo que tiene adelante y que circula por el carril izquierdo y continuar por su carril.", "Cambiarse al carril izquierdo con precaución."], "a": 3, "base": ""}, {"id": "1-94", "part": 1, "n": 94, "q": "Si durante la conducción vehicular, un efectivo de la Policía de Tránsito le solicita al conductor someterse a una prueba de alcoholemia; la acción correcta del conductor es:", "o": ["Someterse a la prueba de alcoholemia, ya que está obligado a ello ante la solicitud del efectivo de la Policía de Tránsito.", "Someterse o negarse a la prueba de alcoholemia, ya que no constituye una obligación del conductor realizarse dicha prueba.", "Negarse a la prueba de alcoholemia, ya que únicamente es exigible si ha participado en un accidente de tránsito.", "Ninguna de las alternativas es correcta."], "a": 0, "base": ""}, {"id": "1-95", "part": 1, "n": 95, "q": "¿Cuál de las siguientes conductas no es una infracción de tránsito?", "o": ["Llevar las placas de rodaje en el lugar que no corresponde.", "Seguir a los vehículos de emergencia y vehículos oficiales para avanzar más rápidamente.", "Arrojar objetos en la vía pública que dificulten la circulación.", "Detenerse totalmente en una señal de PARE cuando no hay peatones y/o vehículos circulando por la vía transversal."], "a": 3, "base": ""}, {"id": "1-96", "part": 1, "n": 96, "q": "Si un conductor sale de su propiedad y tiene que cruzar la acera e ingresar a una vía, la conducta correcta es:", "o": ["Dar preferencia de paso solo a los vehículos que circulan por la vía, pero no a los peatones.", "Dar preferencia de paso a los vehículos que circulan por la vía y a los peatones que circulan por la acera.", "Tocar el claxon para advertir a los peatones que circulen por la acera, que se detengan.", "Salir rápidamente, a fin de evitar accidentes."], "a": 1, "base": ""}, {"id": "1-97", "part": 1, "n": 97, "q": "¿Qué significa una línea continua blanca pintada entre el carril de la derecha y la berma de una carretera?", "o": ["Un carril para motocicletas.", "Una línea que divide el área peatonal y el área de vehículos.", "Una línea que puede cruzarse para rebasar en caso de congestión.", "Que no se debe conducir atravesándola, al menos que haya una situación de emergencia."], "a": 3, "base": ""}, {"id": "1-98", "part": 1, "n": 98, "q": "Si maneja de noche, hubiera neblina y tuviera luces rompenieblas, debe utilizar:", "o": ["Las luces bajas junto con las rompenieblas.", "Solo las luces altas.", "Solo las luces bajas.", "Ninguna de las alternativas es correcta."], "a": 0, "base": ""}, {"id": "1-99", "part": 1, "n": 99, "q": "En el caso representado en el siguiente gráfico ¿el vehículo rojo puede rebasar al azul?", "o": ["Puede hacerlo si no viene un vehículo en el sentido contrario.", "Puede hacerlo solo si, el vehículo en sentido contrario está lejos y alcanza hacer la maniobra con seguridad.", "No puede hacerlo.", "Puede hacerlo por la izquierda."], "a": 2, "base": ""}, {"id": "1-100", "part": 1, "n": 100, "q": "La siguiente señal (R-17), significa:", "o": ["Prohibido estacionar.", "Prohibida la circulación de vehículos automotores.", "Prohibida la circulación de autos particulares.", "Ninguna de las alternativas es correcta."], "a": 1, "base": ""}, {"id": "1-101", "part": 1, "n": 101, "q": "Si usted se encuentra conduciendo su vehículo por una vía y antes de cruzar la intersección se encuentra con la señal R-4, esta le indica:", "o": ["Que la calle está clausurada.", "Que está por ingresar a una vía de sentido contrario y no debe entrar.", "Que debe parar totalmente antes de poder ingresar.", "Ninguna de las alternativas es correcta"], "a": 1, "base": ""}, {"id": "1-102", "part": 1, "n": 102, "q": "La siguiente señal (P-36), significa:", "o": ["Proximidad de un túnel.", "Superficie deslizante.", "Prender las luces bajas.", "Mantener la distancia entre vehículos por seguridad."], "a": 1, "base": ""}, {"id": "1-103", "part": 1, "n": 103, "q": "La siguiente señal (R-14), significa:", "o": ["Circular por el carril de la derecha.", "Circular por el carril central.", "Circular solo en el sentido indicado por la flecha.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-104", "part": 1, "n": 104, "q": "Si usted circula por una vía y se encuentra con la señal (R-11a) , ésta le indica:", "o": ["Que es una vía de tres carriles de un solo sentido.", "Que es una vía de tres carriles y usted puede utilizar solo uno de ellos.", "Que es una vía de tres carriles y usted puede utilizar los dos de la derecha.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-105", "part": 1, "n": 105, "q": "La siguiente señal (R-30c) , significa:", "o": ["Que la velocidad máxima de la vía es de 50 km/h.", "Que la velocidad mínima de la vía es de 50 km/h.", "Que al salir de la vía por donde está circulando, la velocidad máxima es 50 km/h.", "Que al salir de la vía por donde está circulando, la velocidad mínima es 50 km/h."], "a": 2, "base": ""}, {"id": "1-106", "part": 1, "n": 106, "q": "La siguiente señal (R-5-4), significa:", "o": ["Que la vía no continúa y los conductores deben girar a la izquierda.", "Que la intersección contempla giros tangentes a la izquierda en ambos sentidos.", "Que la intersección está en mantenimiento y que por el momento solo se puede girar a la izquierda.", "Ninguna de las alternativas es correcta."], "a": 1, "base": ""}, {"id": "1-107", "part": 1, "n": 107, "q": "La siguiente señal (R-9), significa:", "o": ["Que no está permitido girar en U.", "Que está permitido el giro en U.", "Que si desea puede girar a la izquierda.", "Ninguna de las alternativas es correcta."], "a": 1, "base": ""}, {"id": "1-108", "part": 1, "n": 108, "q": "La siguiente señal (R-5-2), significa:", "o": ["Que la vía solo permite girar a la izquierda.", "Prevención por bifurcación de la vía.", "Que el carril por donde circula permite girar a la izquierda o seguir de frente.", "No es una señal válida en el Perú."], "a": 2, "base": ""}, {"id": "1-109", "part": 1, "n": 109, "q": "La siguiente señal (R-20), significa:", "o": ["Que el peatón antes de cruzar debe mirar si se acercan autos por la derecha.", "Que el conductor que viene por la derecha debe tener cuidado con los peatones.", "Que los peatones deben circular por la izquierda.", "Que los peatones deben circular por la derecha."], "a": 2, "base": ""}, {"id": "1-110", "part": 1, "n": 110, "q": "La siguiente señal (R-40), significa:", "o": ["Crucero tipo cebra.", "Control policial.", "Pavimento deslizante.", "Circular con luces bajas."], "a": 3, "base": ""}, {"id": "1-111", "part": 1, "n": 111, "q": "La siguiente señal (R-48), significa:", "o": ["Los peatones deben circular por la derecha y los camiones por la izquierda", "Los peatones deben tener cuidado con los camiones.", "Zona de carga y descarga.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-112", "part": 1, "n": 112, "q": "La siguiente señal (R-49), significa:", "o": ["Está permitido cambiar de carril por la izquierda y por la derecha.", "Se debe mantener la distancia de seguridad entre vehículos.", "Está permitido cambiar de carril por la izquierda para adelantar.", "Ninguna de las alternativas es correcta."], "a": 1, "base": ""}, {"id": "1-113", "part": 1, "n": 113, "q": "La siguiente señal (R-50), significa:", "o": ["Que si solo hay un carril tiene preferencia de paso el conductor que llegó primero.", "Que si solo hay un carril tiene preferencia el conductor que está mirando la señal.", "Que si solo hay un carril no tiene preferencia el que está mirando la señal y debe darle paso al del sentido contrario.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-114", "part": 1, "n": 114, "q": "La señal (R-5-1), es:", "o": ["Una señal informativa.", "Una señal preventiva.", "Una señal de obligación.", "No es una señal válida en el Perú."], "a": 2, "base": ""}, {"id": "1-115", "part": 1, "n": 115, "q": "La señal (P-3a) , le indica al conductor que:", "o": ["Hay una curva y contra- curva a la izquierda.", "Hay una curva y contra- curva a la derecha.", "Hay una curva y contra- curva pronunciada a la derecha.", "Hay una curva y contra- curva pronunciada a la izquierda."], "a": 2, "base": ""}, {"id": "1-116", "part": 1, "n": 116, "q": "La siguiente señal (P-5-1a) , le advierte al conductor que:", "o": ["Se aproxima a una curva y contra-curva a la izquierda.", "Se aproxima a una curva y contra-curva a la derecha.", "Se aproxima a un camino sinuoso a la derecha.", "Se aproxima a un camino sinuoso a la izquierda."], "a": 3, "base": ""}, {"id": "1-117", "part": 1, "n": 117, "q": "La siguiente señal (P-61), le advierte al conductor que:", "o": ["El sentido del tránsito es el que indica la flecha.", "Se aproxima a una reducción de la vía en ambos sentidos.", "Está circulando por una curva horizontal.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-118", "part": 1, "n": 118, "q": "La siguiente señal (P-34), le advierte al conductor que:", "o": ["La vía está en mal estado y tiene baches.", "Se aproxima a un resalto.", "Se aproxima a un rompe muelles.", "Se aproxima a un badén."], "a": 3, "base": ""}, {"id": "1-119", "part": 1, "n": 119, "q": "La siguiente señal (P-60), es:", "o": ["Una señal turística.", "Una señal informativa.", "Una señal preventiva.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-120", "part": 1, "n": 120, "q": "La siguiente señal (P-46), indica:", "o": ["Existencia de una ciclovía.", "Autorización para el cruce de ciclistas.", "Ciclistas en la vía.", "Cercanía de una ciclovía."], "a": 2, "base": ""}, {"id": "1-121", "part": 1, "n": 121, "q": "La siguiente señal (P-46-a) , indica:", "o": ["Que los ciclistas deben usar la ciclovía.", "Que nos aproximamos a un cruce de ciclovía.", "Que la ciclovía es solo para los ciclistas.", "Todas las alternativas son correctas."], "a": 1, "base": ""}, {"id": "1-122", "part": 1, "n": 122, "q": "La siguiente señal (P-46b) , indica:", "o": ["Que los ciclistas deben detenerse en ese punto.", "Que nos aproximamos a un cruce de ciclovía.", "Que la ciclovía es solo para los ciclistas.", "La ubicación de un cruce de ciclistas."], "a": 3, "base": ""}, {"id": "1-123", "part": 1, "n": 123, "q": "La siguiente señal (P-48), indica:", "o": ["Vía es de uso exclusivo de los peatones.", "Zona con presencia de peatones.", "Ubicación de un cruce escolar.", "Ninguna de las alternativas es correcta."], "a": 1, "base": ""}, {"id": "1-124", "part": 1, "n": 124, "q": "La siguiente señal (P-48a) , indica:", "o": ["Vía es de uso exclusivo de peatones.", "Proximidad a un cruce peatonal.", "Ubicación de un cruce escolar.", "Ninguna de las alternativas es correcta."], "a": 1, "base": ""}, {"id": "1-125", "part": 1, "n": 125, "q": "La siguiente señal (P-48-b) , indica:", "o": ["Ubicación de un cruce escolar.", "Proximidad a una calzada.", "Ubicación de un cruce peatonal.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-126", "part": 1, "n": 126, "q": "La siguiente señal (P-49), indica:", "o": ["Zona escolar.", "Proximidad a un cruce peatonal.", "Zona transitada.", "Ninguna de las alternativas es correcta."], "a": 0, "base": ""}, {"id": "1-127", "part": 1, "n": 127, "q": "La siguiente señal (P-49a) , indica:", "o": ["Zona escolar.", "Proximidad a un cruce escolar.", "Ubicación de un cruce escolar.", "Ninguna de las alternativas es correcta."], "a": 1, "base": ""}, {"id": "1-128", "part": 1, "n": 128, "q": "La siguiente señal (P-49b) , indica:", "o": ["Zona transitada.", "Proximidad a un cruce peatonal.", "Ubicación de un cruce escolar", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-129", "part": 1, "n": 129, "q": "La siguiente señal (P-50), indica:", "o": ["Zona de deportes.", "Proximidad a campo deportivo.", "Proximidad a zona urbana.", "Niños jugando."], "a": 3, "base": ""}, {"id": "1-130", "part": 1, "n": 130, "q": "La siguiente señal (P-51), indica:", "o": ["Zona de parqueo de vehículos pesados.", "Proximidad a zona rural.", "Maquinaria agrícola en la vía.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-131", "part": 1, "n": 131, "q": "La siguiente señal (P-53), indica:", "o": ["Proximidad a un establo.", "Proximidad a zona agrícola.", "Animales en la vía.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-132", "part": 1, "n": 132, "q": "La siguiente señal (P-55), indica:", "o": ["Semáforo malogrado.", "Proximidad a un semáforo.", "Semáforos en ola verde.", "Ninguna de las alternativas es correcta."], "a": 1, "base": ""}, {"id": "1-133", "part": 1, "n": 133, "q": "La siguiente señal (P-58), le indica:", "o": ["Que usted se aproxima a una señal de PARE.", "Que usted debe parar donde está la señal P-58.", "Que se trata de un PARE, pero puede seguir adelante.", "Ninguna de las alternativas es correcta."], "a": 0, "base": ""}, {"id": "1-134", "part": 1, "n": 134, "q": "La siguiente señal (P-59), le indica:", "o": ["Que usted se aproxima a una señal de CEDA EL PASO.", "Que usted debe ceder el paso donde está la señal P- 59.", "Que se trata de un PARE, pero puede seguir adelante.", "Ninguna de las alternativas es correcta."], "a": 0, "base": ""}, {"id": "1-135", "part": 1, "n": 135, "q": "La siguiente señal (P-41), le indica:", "o": ["Que usted se aproxima a una zona de camiones.", "Que usted debe encender sus luces pues se aproxima a una zona con poca visibilidad.", "Que usted se aproxima a un túnel.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-136", "part": 1, "n": 136, "q": "La siguiente señal (P-45), indica:", "o": ["Proximidad a un aeropuerto.", "Proximidad a una pista de aviones.", "Vuelo de aviones a baja altura.", "Aviones que generan ruido."], "a": 2, "base": ""}, {"id": "1-137", "part": 1, "n": 137, "q": "La siguiente señal (P-52), le indica:", "o": ["Que usted debe dar prioridad de paso a las ambulancias.", "Que usted debe dar prioridad de paso a los bomberos.", "Que se aproxima a una salida de vehículos de bomberos.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-138", "part": 1, "n": 138, "q": "La siguiente señal (P-66), le indica:", "o": ["Que se aproxima un desierto.", "Que se aproxima una zona donde hay ráfagas de viento lateral.", "Que se acerca a una zona de arenamiento en la vía.", "Ninguna de las alternativas es correcta."], "a": 1, "base": ""}, {"id": "1-139", "part": 1, "n": 139, "q": "La siguiente señal (P-66a) , le indica:", "o": ["Que se aproxima una tormenta.", "Que está pasando por una zona donde hay ráfagas de viento lateral.", "Que se acerca a una zona de arenamiento en la vía.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-140", "part": 1, "n": 140, "q": "Si al conducir su vehículo se encuentra con la señal vertical que se muestra, usted debe entender que:", "o": ["La vía está interrumpida y debe tomar el camino alternativo que muestra la señal.", "En la siguiente intersección está prohibido girar a la izquierda y por lo tanto, si desea seguir esa ruta debe tomar el camino alternativo que muestra la señal.", "En la siguiente intersección está prohibido girar a la derecha y por lo tanto, si desea seguir esa ruta debe tomar el camino alternativo que muestra la señal.", "Ninguna de las alternativas es correcta."], "a": 1, "base": ""}, {"id": "1-141", "part": 1, "n": 141, "q": "Si al conducir su vehículo se encuentra con la señal vertical que se muestra, usted debe entender que:", "o": ["Si quiere girar a la izquierda debe pasar la intersección y dar la vuelta a la manzana.", "En la siguiente intersección está prohibido girar a la izquierda y por lo tanto, si desea seguir esa ruta debe hacerlo una cuadra antes.", "En esa dirección hay una zona de parqueo.", "Ninguna de las alternativas es correcta."], "a": 0, "base": ""}, {"id": "1-142", "part": 1, "n": 142, "q": "La siguiente señal (I-14), significa:", "o": ["Señal de hostal.", "Señal de hospedaje.", "Señal de hospital.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-143", "part": 1, "n": 143, "q": "La siguiente señal (I-31), significa:", "o": ["Proximidad de una bahía de taxis.", "Proximidad a un estacionamiento permitido.", "Proximidad de una zona de parqueo para vecinos.", "Proximidad de un estacionamiento para emergencias."], "a": 3, "base": ""}, {"id": "1-144", "part": 1, "n": 144, "q": "La siguiente señal (I-9), significa:", "o": ["Zona de control policial.", "Zona de control de aduanas.", "Zona militar.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-145", "part": 1, "n": 145, "q": "La siguiente señal (I-18), se utiliza para indicar:", "o": ["Cercanía a una ferretería.", "Cercanía a un servicio mecánico.", "Cercanía a un grifo.", "Ninguna de las alternativas es correcta"], "a": 1, "base": ""}, {"id": "1-146", "part": 1, "n": 146, "q": "La siguiente señal (I-19), se utiliza para indicar:", "o": ["Cercanía a un servicio mecánico.", "Cercanía a una tienda.", "Cercanía a un grifo.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-147", "part": 1, "n": 147, "q": "La siguiente señal (I-20), se utiliza para indicar:", "o": ["Cercanía a un servicio mecánico.", "Cercanía a una zona donde debe circular con cadenas en las llantas.", "Cercanía a un grifo.", "Cercanía a una llantería."], "a": 3, "base": ""}, {"id": "1-148", "part": 1, "n": 148, "q": "La siguiente señal (R-16a) , se utiliza para indicar:", "o": ["Fin de la restricción de circulación de automotores.", "Fin de la restricción de prohibido adelantar.", "Fin de la restricción de circulación en doble sentido.", "Ninguna de las alternativas es correcta."], "a": 1, "base": ""}, {"id": "1-149", "part": 1, "n": 149, "q": "El comportamiento del conductor como usuario de la vía, debe estar orientado a:", "o": ["Valor por la vida.", "Respeto por la integridad física del resto de los usuarios.", "Respeto a la autoridad encargada de la vigilancia y disciplina de tráfico.", "Todas las alternativas son correctas."], "a": 3, "base": ""}, {"id": "1-150", "part": 1, "n": 150, "q": "Son considerados usuarios vulnerables de la vía y por tanto merecen especial protección:", "o": ["Peatones, niños, adultos mayores, personas con movilidad reducida, ciclistas.", "Únicamente los peatones y ciclistas.", "Únicamente los peatones y niños.", "Todas las alternativas son correctas, con excepción de los ciclistas."], "a": 0, "base": ""}, {"id": "1-151", "part": 1, "n": 151, "q": "La siguiente señal (P-61), muestra:", "o": ["Flechas retroreflectivas que indican peligro.", "Delineadores de curva, que guían al conductor.", "Advertencia al conductor sobre la proximidad de un puente.", "Ninguna de las alternativas es correcta."], "a": 1, "base": ""}, {"id": "1-152", "part": 1, "n": 152, "q": "Si usted es titular de una licencia particular A-I, está autorizado a conducir el siguiente vehículo:", "o": ["Camión, tipo volquete.", "Ómnibus, tipo panorámico.", "Mototaxi.", "Automóvil, tipo sedan."], "a": 3, "base": ""}, {"id": "1-153", "part": 1, "n": 153, "q": "Mientras la persona conduce, le está permitido:", "o": ["Compartir su asiento con un niño, siempre y cuando éste sea menor de un año de edad.", "Que otra persona tome el control de la dirección del vehículo, siempre y", "Conducir con una mano sobre el volante de dirección, cuando es necesario accionar algún comando del vehículo, como realizar los cambios de velocidad.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-154", "part": 1, "n": 154, "q": "El conductor está ________ a ___________ a las pruebas que le solicite el Efectivo de la Policía Nacional del Perú, asignado al control del tránsito, para determinar su estado de intoxicación por alcohol, drogas, estupefacientes u otros tóxicos", "o": ["En su derecho - negarse.", "Facultado - Rechazar.", "Obligado - someterse.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-155", "part": 1, "n": 155, "q": "Ante un conductor con evidente discapacidad física, la cual no figura en el rubro de restricciones de su licencia de conducir, procede:", "o": ["Que la Policía de Tránsito intervenga a dicho conductor y que la autoridad que expidió la licencia de conducir ordene su reexaminación.", "Que la autoridad competente expida un permiso excepcional para dicho conductor.", "Que la Policía de Tránsito expida un permiso excepcional para dicho conductor.", "Que la Policía de Tránsito otorgue a dicho conductor un plazo prudencial para que continúe conduciendo."], "a": 0, "base": ""}, {"id": "1-156", "part": 1, "n": 156, "q": "¿Una persona con discapacidad física puede obtener una licencia de conducir particular?", "o": ["Sí, siempre y cuando dicha discapacidad pueda ser superada con algún corrector que establezca alguna de las restricciones que prevé la norma vigente.", "No, está terminantemente prohibido.", "Depende del criterio del centro de emisión de la licencia de conducir.", "Ninguna de las alternativas es correcta."], "a": 0, "base": ""}, {"id": "1-157", "part": 1, "n": 157, "q": "¿Puede una persona menor de edad conducir un vehículo?", "o": ["Nunca.", "Sí, siempre y cuando vaya acompañada de una personas mayor de edad y titular de una licencia de conducir.", "No, salvo que conduzca un vehículo de dimensión reducida.", "Sí, siempre y cuando sea mayor de 16 años y cuente con licencia de conducir o permiso provisional, conforme a lo dispuesto en el Reglamento Nacional del Sistema de Emisión de Licencias de Conducir."], "a": 3, "base": ""}, {"id": "1-158", "part": 1, "n": 158, "q": "Es una obligación general de tránsito que, los ____________ circulen respetando los mensajes de _______________, las instrucciones de los Efectivos de la Policía de Tránsito y el mandato de las normas legales y reglamentarias correspondientes.", "o": ["Peatones - los letreros instalados en las vías públicas.", "Los usuarios de la vía pública - los dispositivos de control de tránsito.", "Vehículos - los medios de comunicación.", "Menores de edad - los adultos mayores."], "a": 1, "base": ""}, {"id": "1-159", "part": 1, "n": 159, "q": "Marque la afirmación incorrecta:", "o": ["Está prohibido arrojar, depositar o abandonar objetos en la vía pública, o cualquier otro obstáculo que pueda dificultar la circulación.", "El conductor debe mantener el vehículo que conduce con el combustible necesario para evitar detenciones en la vía.", "Los vehículos deben circular en vías urbanas con las luces bajas las 24 horas del día.", "En caso de haber agua en la calzada, el conductor de un vehículo debe tomar las precauciones, para evitar que ésta pueda mojar la acera y los peatones."], "a": 2, "base": ""}, {"id": "1-160", "part": 1, "n": 160, "q": "¿Si al conducir por una avenida se encuentra con una señal en la vía que indica un límite máximo de 50 km/h, sin embargo, conforme a lo dispuesto en la norma el límite máximo de velocidad en dicha vía es de 60 km/h; usted:", "o": ["Debe obedecer la señal de velocidad instalada en la vía.", "Puede ir a una velocidad máxima de 60 km/h.", "Debe ir a una velocidad máxima de 60 km/h.", "Debe ir a una velocidad entre 50 y 60 km/h."], "a": 0, "base": ""}, {"id": "1-161", "part": 1, "n": 161, "q": "Sobre la conducción en retroceso, marque la opción correcta:", "o": ["Está prohibida, salvo en casos estrictamente justificados.", "Nunca debe realizarse.", "Está permitida", "Está permitida, salvo en carreteras."], "a": 0, "base": ""}, {"id": "1-162", "part": 1, "n": 162, "q": "El uso de la luz ___________ es obligatorio en __________ , debiendo cambiar por luz ____________ momentos previos al cruce con otro vehículo que circule en sentido contrario.", "o": ["Baja - carreteras - alta.", "Alta - vías urbanas - baja.", "Rompenieblas - carreteras - baja.", "Alta - carretereras - baja."], "a": 3, "base": ""}, {"id": "1-163", "part": 1, "n": 163, "q": "Indique la conducta permitida:", "o": ["El estacionamiento de un vehículo a la salida de salas de espectáculos en funcionamiento.", "El estacionamiento de un vehículo de emergencia en un lugar no permitido, si ello fuera imprescindible.", "El estacionamiento de un vehículo después de 1 metro de un paso peatonal.", "El estacionamiento de un vehículo sobre las aceras."], "a": 1, "base": ""}, {"id": "1-164", "part": 1, "n": 164, "q": "Se considera el abandono de un vehículo cuando:", "o": ["El vehículo está estacionado en un lugar permitido en la vía pública, pero sin conductor por un tiempo mayor de 72 horas.", "El vehículo está estacionado en un lugar permitido en la vía pública, pero sin conductor por un tiempo mayor de 96 horas.", "El vehículo está estacionado en un lugar permitido en la vía pública, pero sin conductor y por un tiempo mayor de 48 horas.", "La norma de tránsito no establece nada sobre el abandono del vehículo."], "a": 2, "base": ""}, {"id": "1-165", "part": 1, "n": 165, "q": "Al transportar carga en su vehículo, usted debe:", "o": ["Asegurarse, en caso la carga sobresalga lateralmente de la carrocería, esté bien sujeta.", "Evitar todo riesgo de caída de la carga que sobresale lateralmente de la carrocería.", "Tratar que la carga no sea arrastrada.", "Asegurarse que la carga no sobrepase las dimensiones de la carrocería."], "a": 3, "base": ""}, {"id": "1-166", "part": 1, "n": 166, "q": "Sobre la emisión vehicular de sustancias contaminantes, marque la opción correcta:", "o": ["Está permitida.", "Está prohibida, en un índice superior al límite máximo que permite la norma.", "Está prohibida en el ámbito urbano.", "La norma no regula sobre ello."], "a": 1, "base": ""}, {"id": "1-167", "part": 1, "n": 167, "q": "La autoridad competente, ______________ puede prohibir o restringir _____________________ en determinadas vías públicas.", "o": ["Cuando la situación lo justifique - la circulación o estacionamiento de vehículos.", "Aun cuando la situación lo justifique no - circulación o estacionamiento de vehículos.", "No se encuentra facultada ni - circulación de vehículos", "Únicamente con el consentimiento del conductor - circulación de vehículos."], "a": 0, "base": ""}, {"id": "1-168", "part": 1, "n": 168, "q": "Si al conducir en una carretera de noche se aproxima un vehículo en sentido contrario; usted debe:", "o": ["Cambiar de luces bajas a luces altas", "Encender las luces de emergencia.", "Cambiar de luces altas a luces bajas.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-169", "part": 1, "n": 169, "q": "La detención de un vehículo debe efectuarse:", "o": ["En el sentido contrario a la circulación y en el carril izquierdo de la vía.", "En el sentido de la circulación y en el carril derecho de la vía, utilizando las luces altas.", "En el sentido de la circulación y en el carril izquierdo de la vía, utilizando las luces intermitentes.", "En el sentido de la circulación y en el carril derecho de la vía, utilizando las luces intermitentes."], "a": 3, "base": ""}, {"id": "1-170", "part": 1, "n": 170, "q": "En caso de un accidente de tránsito con daños personales y/o materiales los participantes deben:", "o": ["Acudir a la estación de bomberos.", "Llamar a un familiar.", "Solicitar la intervención de la autoridad policial.", "Abandonar el lugar donde ocurrió el accidente."], "a": 2, "base": ""}, {"id": "1-171", "part": 1, "n": 171, "q": "El conductor antes de iniciar la conducción de un vehículo no está obligado a:", "o": ["Portar la tarjeta de identificación vehicular del vehículo que conduce.", "Portar y exhibir la Placa Única de Rodaje.", "Constatar que el vehículo tiene SOAT vigente.", "Ninguna de las alternativas es correcta."], "a": 3, "base": ""}, {"id": "1-172", "part": 1, "n": 172, "q": "La faculta y autoriza la circulación del vehículo por la vía pública, identifica el bien, y, por ende, al titular responsable de las acciones que deriven de su propiedad.", "o": ["Tarjeta de identificación vehicular.", "Municipalidad provincial.", "La Superintendencia Nacional de Aduanas y de Administración Tributaria - SUNAT.", "Placa Única Nacional de Rodaje."], "a": 3, "base": ""}, {"id": "1-173", "part": 1, "n": 173, "q": "A fin de determinar la presencia de alcohol o sustancias estupefacientes en el conductor, el efectivo de la Policía de Tránsito puede exigirle al momento de la intervención:", "o": ["Que realice pruebas de coordinación y equilibrio.", "Uso del alcoholímetro.", "Prueba de alcoholemia.", "Todas las alternativas son correctas."], "a": 3, "base": ""}, {"id": "1-174", "part": 1, "n": 174, "q": "¿El Reglamento Nacional de Tránsito considera la reincidencia en las infracciones de tránsito?", "o": ["No, el conductor puede cometer la misma infracción varias veces y la sanción será la misma.", "Si, cuando el conductor comete la misma infracción dentro de los 12 meses será sancionado con el doble de la multa.", "Solo en los casos en que se cometan infracciones gravísimas.", "Ninguna de las alternativas es correcta."], "a": 1, "base": ""}, {"id": "1-175", "part": 1, "n": 175, "q": "¿Después de qué tiempo de haber cometido la misma infracción se llama reincidencia y es sancionada con el doble de la multa establecida?", "o": ["06 meses.", "12 meses.", "24 meses.", "35 meses."], "a": 1, "base": ""}, {"id": "1-176", "part": 1, "n": 176, "q": "Si a un conductor infractor le suspendieron su licencia de conducir, éste se encuentra facultado para:", "o": ["Tramitar el duplicado de su licencia de conducir.", "Tramitar la revalidación de su licencia de conducir.", "Tramitar la recategorización de su licencia de conducir.", "Ninguna de las alternativas es correcta."], "a": 3, "base": ""}, {"id": "1-177", "part": 1, "n": 177, "q": "Las __________________ tienen por función informar a los usuarios sobre los servicios generales existentes próximos a la vía, tales como teléfono, hospedaje, restaurante, primeros auxilios, estación de combustibles, talleres, y otros.", "o": ["Señales de localización.", "Señales de salida inmediata.", "Señales de servicios generales.", "Señales ordinarias"], "a": 2, "base": ""}, {"id": "1-178", "part": 1, "n": 178, "q": "¿Constituye una infracción tramitar el duplicado de una licencia de conducir que se encuentra retenida?", "o": ["No constituye una infracción.", "Solo cuando la licencia de conducir ha sido retenida por la comisión de una infracción muy grave.", "Si, constituye una infracción.", "Ninguna de las alternativas es correcta."], "a": 2, "base": ""}, {"id": "1-179", "part": 1, "n": 179, "q": "Las marcas en el pavimento constituyen la señalización ___________ y se emplean para _____________ la circulación.", "o": ["Horizontal - reglamentar.", "Vertical - reglamentar.", "Más importante - mejorar.", "Menos importante - adornar."], "a": 0, "base": ""}, {"id": "1-180", "part": 1, "n": 180, "q": "Ciclista es a ciclovía como:", "o": ["Conductor - acera.", "Conductor - calzada.", "Conductor - berma.", "Peatón - autopista."], "a": 1, "base": ""}, {"id": "1-181", "part": 1, "n": 181, "q": "La siguiente señal (P-15), se utiliza para advertir al conductor:", "o": ["La proximidad a una vía de tres carriles.", "La proximidad a un huracán.", "La proximidad a un camino sinuoso.", "La proximidad de una intersección rotatoria (óvalo o rotonda)."], "a": 3, "base": ""}, {"id": "1-182", "part": 1, "n": 182, "q": "La siguiente señal (P-31a) , indica:", "o": ["La proximidad del final de la vía.", "La proximidad de una vía asfaltada.", "La proximidad de una pendiente leve.", "Ninguna de las alternativas es correcta."], "a": 0, "base": ""}, {"id": "1-183", "part": 1, "n": 183, "q": "Es una línea transversal a la calzada, que indica al conductor que debe detener completamente el vehículo, no debiendo sobrepasar el inicio de la indicada línea:", "o": ["Línea de carril.", "Línea de borde de calzada.", "Línea de pare.", "Todas las alternativas son correctas."], "a": 2, "base": ""}, {"id": "1-184", "part": 1, "n": 184, "q": "Los semáforos son:", "o": ["Dispositivos de control del tránsito que tienen por finalidad regular y controlar el tránsito vehicular, motorizado y no motorizado, y el peatonal, a través de las indicaciones de las luces respectivas.", "Dispositivos de control del tránsito que tienen por finalidad regular y controlar únicamente el tránsito vehicular motorizado y peatonal, a través de las indicaciones de luces.", "Señales de color rojo, verde y amarillo, que tienen como único fin regular la corriente vehicular.", "Artefactos que emiten luces de colores y cuyo único fin es regular la corriente de vehículos motorizados y peatones."], "a": 0, "base": ""}, {"id": "1-185", "part": 1, "n": 185, "q": "La conducción requiere un alto nivel de atención, pues existen distracciones que pueden ocasionar accidentes de tránsito, como por ejemplo:", "o": ["Preocupaciones.", "Uso del teléfono celular.", "Manipulación de la radio mientras se conduce.", "Todas las alternativas son correctas."], "a": 3, "base": ""}, {"id": "1-186", "part": 1, "n": 186, "q": "¿Influye la somnolencia en la capacidad de conducir?", "o": ["Si, pues el conductor tomará decisiones lentas que lo inducirán a cometer errores.", "Si, ya que el conductor está de mal genio.", "No, siempre que la conducción sea realizada lentamente.", "No, siempre y cuando la conducción sea realizada con un acompañante."], "a": 0, "base": ""}, {"id": "1-187", "part": 1, "n": 187, "q": "¿Cuál es la acción correcta del conductor, según las normas de tránsito, en la situación que plantea el siguiente gráfico?", "o": ["Girar rápidamente a la derecha antes que el peatón cruce la calzada.", "Dar preferencia de paso al peatón para que cruce la calzada.", "Girar lentamente a la derecha antes que el peatón cruce la calzada.", "Tocar el claxon para que el peatón no cruce la calzada"], "a": 1, "base": ""}, {"id": "1-188", "part": 1, "n": 188, "q": "¿En cuál de las siguientes opciones, los factores mencionados contribuyen a una colisión vehicular?", "o": ["Pavimento seco, somnolencia, frenos desgastados.", "Pavimento húmedo, neumáticos desgastados, cansancio.", "Reductores de velocidad, falta de atención, uso del teléfono celular.", "Ninguna de las alternativas es correcta."], "a": 1, "base": ""}, {"id": "1-189", "part": 1, "n": 189, "q": "La __________ es la parte de una carretera o camino contigua a la calzada, no habilitada para la circulación de vehículos y destinada eventualmente a la detención de vehículos en emergencia y circulación de peatones.", "o": ["Berma.", "Autopista.", "Acera.", "Demarcación."], "a": 0, "base": ""}, {"id": "1-190", "part": 1, "n": 190, "q": "Es una parte de la vía destinada a la circulación de vehículos y eventualmente al cruce de peatones y animales.", "o": ["La calzada.", "La acera.", "La berma.", "Ninguna de las alternativas es correcta."], "a": 0, "base": ""}, {"id": "1-191", "part": 1, "n": 191, "q": "Es una parte de la vía destinada al uso de peatones", "o": ["La acera.", "La calzada.", "La berma.", "La autopista."], "a": 0, "base": ""}, {"id": "1-192", "part": 1, "n": 192, "q": "Son señales que regulan el tránsito:", "o": ["Las bocinas y las marcas en la calzada o señales horizontales.", "Las bocinas y las señales verticales.", "Las señales verticales, las marcas en la calzada o señales horizontales y las bocinas.", "Las señales verticales y las marcas en la calzada o señales horizontales."], "a": 3, "base": ""}, {"id": "1-193", "part": 1, "n": 193, "q": "Los vehículos deben ser conducidos con:", "o": ["Puertas y capot cerrados, permitiéndose la maletera entreabierta para casos especiales.", "Puertas, capot y maletera cerrados.", "Puertas, capot y maletera cerrados, salvo autorización especial.", "Capot y maletera cerrados, permitiéndose dos puertas entreabiertas para casos especiales."], "a": 1, "base": ""}, {"id": "1-194", "part": 1, "n": 194, "q": "El conductor que en una vía urbana va a girar a la izquierda, a la derecha o en ¿U¿ debe hacer la señal respectiva con la luz direccional, por lo menos:", "o": ["2 segundos antes de realizar la maniobra.", "1 metro antes de realizar la maniobra.", "20 metros antes de realizar la maniobra.", "3 metros antes de realizar la maniobra."], "a": 2, "base": ""}, {"id": "1-195", "part": 1, "n": 195, "q": "Si usted está conduciendo por una carretera y va girar a la izquierda, debe realizar la señal respectiva con la luz direccional por lo menos:", "o": ["2 segundos antes de realizar la maniobra.", "2 metros antes de realizar la maniobra.", "30 metros antes de realizar la maniobra.", "1 metro antes de realizar la maniobra."], "a": 2, "base": ""}, {"id": "1-196", "part": 1, "n": 196, "q": "La licencia particular de la Clase y Categoría A-I, permite conducir motos?", "o": ["Si.", "No", "Únicamente en el ámbito urbano.", "Únicamente en carreteras."], "a": 1, "base": ""}, {"id": "1-197", "part": 1, "n": 197, "q": "El siguiente gráfico muestra:", "o": ["Señalización de tránsito vertical y horizontal en una zona escolar.", "Únicamente señalización de tránsito vertical en una zona escolar.", "Únicamente señalización de tránsito horizontal en una zona escolar.", "Ninguna de las alternativas es correcta."], "a": 0, "base": ""}, {"id": "1-198", "part": 1, "n": 198, "q": "Las __________canalizadoras, tiene por función conformar las islas canalizadoras del tránsito automotor en una _________.", "o": ["Islas canalizadoras - vía.", "Líneas - intersección.", "Vías - intersección.", "Todas las alternativas son correctas."], "a": 1, "base": ""}, {"id": "1-199", "part": 1, "n": 199, "q": "Si al conducir en una intersección se en
